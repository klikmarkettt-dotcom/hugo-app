<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hugo · Ultra AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#07070f;
  --bg2:#0d0d18;
  --card:#12121f;
  --card2:#1a1a2e;
  --border:#1f1f33;
  --border2:#2a2a42;
  --txt:#e8ecff;
  --txt2:#8890b5;
  --txt3:#5a5f80;
  --cyan:#00e5ff;
  --purple:#a855f7;
  --pink:#ff2d92;
  --green:#00ff88;
  --yellow:#ffd60a;
  --red:#ff4757;
  --grad1:linear-gradient(135deg,#00e5ff 0%,#a855f7 100%);
  --grad2:linear-gradient(135deg,#a855f7 0%,#ff2d92 100%);
  --grad3:linear-gradient(135deg,#00ff88 0%,#00e5ff 100%);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ═══ HEADER ═══ */
header{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:rgba(13,13,24,.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;
}
.logo{
  width:36px;height:36px;border-radius:11px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 0 24px rgba(0,229,255,.35),inset 0 1px 0 rgba(255,255,255,.2);
  flex-shrink:0;position:relative;
}
.logo::after{
  content:'';position:absolute;inset:0;border-radius:11px;
  background:linear-gradient(135deg,rgba(255,255,255,.3) 0%,transparent 50%);
  pointer-events:none;
}
.info{flex:1;min-width:0}
.info h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em}
.info .sub{font-size:11px;color:var(--txt2);margin-top:1px;display:flex;align-items:center;gap:6px}
.pulse-dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--txt2);transition:all .15s;
}
.icon-btn:active{background:var(--card2);transform:scale(.95);color:var(--txt)}

/* ═══ CHAT ═══ */
#chat{flex:1;overflow-y:auto;padding:20px 16px 8px;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;display:flex;flex-direction:column;gap:4px}
.msg{
  margin:6px 0;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.55;
  max-width:88%;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;
  animation:msgIn .25s cubic-bezier(.4,0,.2,1);position:relative;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.user{
  background:var(--grad1);color:#000;margin-left:auto;font-weight:500;
  border-bottom-right-radius:6px;box-shadow:0 4px 20px rgba(0,229,255,.25);
}
.hugo{
  background:var(--card);color:var(--txt);border-left:3px solid;
  border-image:var(--grad2) 1;border-bottom-left-radius:6px;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.hugo code{
  background:rgba(0,0,0,.4);padding:2px 6px;border-radius:5px;font-size:13px;
  color:var(--cyan);font-family:'SF Mono',Menlo,Monaco,monospace;word-break:break-all;
}
.hugo pre{
  background:rgba(0,0,0,.5);padding:12px 14px;border-radius:10px;overflow-x:auto;
  margin:8px 0;font-size:13px;font-family:'SF Mono',Menlo,Monaco,monospace;
  border:1px solid var(--border2);line-height:1.5;
}
.hugo pre code{background:none;padding:0;color:var(--txt)}
.hugo a{color:var(--cyan);text-decoration:none;border-bottom:1px dashed rgba(0,229,255,.4)}
.hugo b{color:#fff;font-weight:600}
.hugo h1,.hugo h2,.hugo h3{color:#fff;margin:10px 0 6px;font-weight:600}
.hugo ul,.hugo ol{margin:6px 0 6px 20px}
.hugo li{margin:3px 0}
.hugo hr{border:none;border-top:1px solid var(--border2);margin:10px 0}
.err{background:rgba(255,71,87,.15);color:#ff9999;border-left:3px solid var(--red);
  font-size:14px;padding:10px 14px;border-radius:12px;max-width:88%}
.sys-msg{color:var(--txt3);font-size:12px;text-align:center;margin:8px 0;font-style:italic}
.think{color:var(--txt2);font-style:italic;display:flex;align-items:center;gap:8px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--purple);
  animation:bounce 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ═══ WELCOME ═══ */
.welcome{text-align:center;padding:40px 20px;color:var(--txt2);animation:msgIn .4s}
.welcome .hero{
  width:80px;height:80px;margin:0 auto 20px;border-radius:24px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 0 60px rgba(0,229,255,.4),inset 0 1px 0 rgba(255,255,255,.2);
  animation:float 3s ease-in-out infinite;position:relative;
}
.welcome .hero::after{
  content:'';position:absolute;inset:0;border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%);
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h2{color:#fff;font-size:24px;font-weight:700;margin:0 0 6px;
  background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text}
.welcome p{margin:6px 0;font-size:14px;line-height:1.6}
.welcome .stats{
  display:flex;justify-content:center;gap:20px;margin:24px 0;flex-wrap:wrap;
}
.welcome .stat{text-align:center}
.welcome .stat b{display:block;font-size:24px;color:var(--cyan);font-weight:700}
.welcome .stat span{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.sg{
  display:inline-block;padding:10px 16px;margin:5px 4px;background:var(--card);
  border-radius:14px;color:var(--txt);font-size:13px;cursor:pointer;
  border:1px solid var(--border2);transition:all .15s;font-weight:500;
}
.sg:hover,.sg:active{background:var(--card2);border-color:var(--cyan);color:var(--cyan);
  transform:translateY(-1px)}

/* ═══ INPUT ═══ */
#input-area{
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:rgba(13,13,24,.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-top:1px solid var(--border);flex-shrink:0;z-index:10;
}
#input-row{
  display:flex;gap:8px;align-items:flex-end;background:var(--card);
  border-radius:24px;padding:6px 6px 6px 18px;border:1px solid var(--border2);
  transition:all .2s;box-shadow:0 4px 20px rgba(0,0,0,.3);
}
#input-row:focus-within{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,229,255,.08),0 4px 20px rgba(0,0,0,.3)}
#msg{
  flex:1;padding:8px 0;border:none;background:transparent;color:#fff;font-size:16px;
  resize:none;max-height:140px;min-height:24px;line-height:1.4;
}
#msg::placeholder{color:var(--txt3)}
#send{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--grad1);
  color:#000;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;transition:all .15s;
  box-shadow:0 0 20px rgba(0,229,255,.3);
}
#send:active{transform:scale(.9)}
#send:disabled{opacity:.3;box-shadow:none}

/* ═══ SIDEBAR ═══ */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;
  background:var(--bg2);border-right:1px solid var(--border);
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:100;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:10px 0 40px rgba(0,0,0,.5);
}
#sidebar.open{transform:translateX(0)}
.sb-header{
  padding:20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.sb-header h2{font-size:20px;font-weight:700;
  background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text}
.sb-body{flex:1;overflow-y:auto;padding:8px}
.sb-item{
  padding:12px 14px;border-radius:12px;margin-bottom:2px;display:flex;align-items:center;
  gap:12px;color:var(--txt);font-size:14px;cursor:pointer;transition:all .12s;
  font-weight:500;
}
.sb-item:active{background:var(--card);transform:scale(.98)}
.sb-item .ico{
  width:32px;height:32px;border-radius:9px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  border:1px solid var(--border2);
}
.sb-item .text{flex:1}
.sb-item .badge{
  font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(0,229,255,.15);
  color:var(--cyan);font-weight:600;
}
.sb-item.danger{color:var(--red)}
.sb-section{
  padding:16px 14px 6px;font-size:11px;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1.2px;font-weight:700;
}
#backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;
  opacity:0;pointer-events:none;transition:opacity .25s;
  backdrop-filter:blur(4px);
}
#backdrop.on{opacity:1;pointer-events:auto}

/* ═══ MODAL ═══ */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(8px);padding:0;
}
.modal.on{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{
  background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;
  max-width:600px;width:100%;border:1px solid var(--border2);
  border-bottom:none;max-height:85vh;overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;
}
.modal-header h2{font-size:20px;font-weight:700;color:#fff}
.close-btn{
  width:36px;height:36px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt2);
}
.close-btn:active{background:var(--card2);transform:scale(.9)}
.modal input[type=text],.modal input[type=search],.modal input[type=password],.modal select{
  width:100%;padding:14px 16px;border-radius:12px;background:var(--card);
  color:#fff;border:1px solid var(--border2);font-size:15px;margin-bottom:12px;
  transition:border-color .15s;
}
.modal input:focus,.modal select:focus{border-color:var(--cyan)}
.modal button.primary{
  width:100%;padding:14px;border-radius:12px;background:var(--grad1);color:#000;
  font-weight:700;font-size:15px;margin-bottom:8px;transition:transform .1s;
}
.modal button.primary:active{transform:scale(.98)}
.modal button.secondary{
  width:100%;padding:14px;border-radius:12px;background:var(--card);color:var(--txt2);
  font-weight:500;font-size:15px;
}

/* ═══ AGENT GRID ═══ */
.agent-grid{display:grid;gap:8px;margin-top:8px}
.agent-cat{
  padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);
  cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;
}
.agent-cat:active{background:var(--card2);transform:scale(.98);border-color:var(--cyan)}
.agent-cat .ico{font-size:24px;width:40px;height:40px;border-radius:11px;
  background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agent-cat .info{flex:1;min-width:0}
.agent-cat .info b{color:#fff;font-size:14px;display:block;font-weight:600}
.agent-cat .info span{color:var(--txt3);font-size:11px}
.agent-list{display:grid;gap:6px;margin-top:8px}
.agent-item{
  padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px;
}
.agent-item:active{background:var(--card2);border-color:var(--cyan)}
.agent-item .dot-small{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex-shrink:0}

/* ═══ TOAST ═══ */
#toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--card);color:#fff;padding:12px 20px;border-radius:12px;
  font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.6);border:1px solid var(--border2);
  z-index:500;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;
  max-width:90vw;
}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ═══ LOADER ═══ */
#loader{
  position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .4s;
}
#loader.off{opacity:0;pointer-events:none}
#loader .hero{
  width:80px;height:80px;border-radius:24px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 0 60px rgba(0,229,255,.5);animation:float 2s infinite;
}
#loader p{color:var(--txt2);font-size:14px;font-weight:500}
#loader .bar{
  width:200px;height:3px;background:var(--card);border-radius:2px;overflow:hidden;
}
#loader .bar-fill{
  height:100%;background:var(--grad1);border-radius:2px;width:0;
  animation:fill 2s ease-in-out infinite;
}
@keyframes fill{0%{width:0%}50%{width:80%}100%{width:100%}}

/* responsive */
@media (max-width:500px){
  .welcome .hero{width:70px;height:70px;font-size:38px}
  .welcome h2{font-size:20px}
  .msg{max-width:92%}
}
</style>
</head>
<body>

<div id="loader">
  <div class="hero">🤖</div>
  <p id="loader-text">Loading Hugo Ultra…</p>
  <div class="bar"><div class="bar-fill"></div></div>
</div>

<div id="backdrop"></div>

<aside id="sidebar">
  <div class="sb-header">
    <h2>🤖 Hugo Ultra</h2>
    <button class="close-btn" id="sb-close">✕</button>
  </div>
  <div class="sb-body">
    <div class="sb-item" data-action="new">
      <div class="ico">💬</div><div class="text">Нов разговор</div>
    </div>
    <div class="sb-item" data-action="agents">
      <div class="ico">🎭</div><div class="text">Агенти</div>
      <div class="badge" id="agent-count">0</div>
    </div>
    <div class="sb-item" data-action="models">
      <div class="ico">⚡</div><div class="text">Модел: <span id="model-name">openai</span></div>
    </div>
    <div class="sb-section">Податоци</div>
    <div class="sb-item" data-action="stats">
      <div class="ico">📊</div><div class="text">Статистика</div>
    </div>
    <div class="sb-item" data-action="export">
      <div class="ico">💾</div><div class="text">Извези разговор</div>
    </div>
    <div class="sb-item danger" data-action="clear">
      <div class="ico">🗑</div><div class="text">Избриши сè</div>
    </div>
    <div class="sb-section">Информации</div>
    <div class="sb-item" data-action="about">
      <div class="ico">ℹ️</div><div class="text">За Hugo</div>
    </div>
  </div>
</aside>

<header>
  <button class="icon-btn" id="btn-menu">☰</button>
  <div class="logo">🤖</div>
  <div class="info">
    <h1>Hugo Ultra</h1>
    <div class="sub">
      <span class="pulse-dot"></span>
      <span id="status">Ready</span>

</header>

<div id="chat"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="msg" placeholder="Кажи што да направам…" rows="1"></textarea>
    <button id="send">➤</button>
  </div>
</div>

<div id="toast"></div>

<!-- AGENT MODAL -->
<div class="modal" id="modal-agents">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🎭 Агенти</h2>
      <button class="close-btn" id="modal-agents-close">✕</button>
    </div>
    <input type="search" id="agent-search" placeholder="Пребарај агенти…">
    <div id="agent-content"></div>
  </div>
</div>

<!-- MODEL MODAL -->
<div class="modal" id="modal-model">
  <div class="modal-content">
    <div class="modal-header">
      <h2>⚡ Модел</h2>
      <button class="close-btn" id="modal-model-close">✕</button>
    </div>
    <select id="model-select">
      <option value="openai">OpenAI GPT-4o mini</option>
      <option value="openai-large">OpenAI GPT-4o</option>
      <option value="mistral">Mistral</option>
      <option value="llama">Llama 3.1</option>
      <option value="qwen-coder">Qwen Coder</option>
      <option value="deepseek">DeepSeek</option>
      <option value="claude-hybridspace">Claude (Hybrid)</option>
    </select>
    <button class="primary" id="model-save">Зачувај</button>
  </div>
</div>

// Generate agents
const AGENTS = {};
function generateAgents(){
  let id = 0;
  for (const [cat, [emoji, desc, roles, mods]] of Object.entries(AGENT_DATA)) {
    for (const role of roles) {
      for (const mod of mods) {
        id++;
        const key = `${cat}_${role.toLowerCase().replace(/[^a-z0-9]/g,'_')}_${mod.toLowerCase().replace(/[^a-z0-9]/g,'_')}`;
        AGENTS[key] = {
          id,
          cat,
          emoji,
          role: `${role} (${mod})`,
          short: role,
          mod,
          desc: `${role} specialized in ${mod.toLowerCase()} — ${desc}`,
          sys: `You are ${role}, an expert specializing in ${mod.toLowerCase()} for ${desc}. Be precise, professional, concise. Reply in user's language.`
        };
      }
    }
  }
  return id;
}

// ═══════════════════════════════════════════════════════════════
//  HELPERS

function setStatus(t){ statusEl.textContent = t; }
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function showToast(msg, ms=2000){
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove('on'), ms);
}

// Markdown render
function renderMD(t){
  if (!t) return '';
  let h = esc(t);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  h = h.replace(/^\s*[-*] (.+)$/gm, '• $1');
  h = h.replace(/^\s*(\d+)\. (.+)$/gm, '$1. $2');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}

  return el;
}

// ═══════════════════════════════════════════════════════════════
//  LLM CALL — FREE, WORKS
// ═══════════════════════════════════════════════════════════════
async function callLLM(prompt, system){
  const full = (system ? system + '\n\n' : '') + prompt;
  const models = [STATE.model, 'openai', 'mistral', 'llama'];
  const tried = new Set();
  for (const model of models){
    if (tried.has(model)) continue;
    tried.add(model);
    try {
      setStatus(`Trying ${model}…`);
      const url = `https://text.pollinations.ai/${encodeURIComponent(full)}?model=${model}&private=true`;
      const r = await fetch(url);
      if (!r.ok) continue;
      const text = await r.text();
      if (text && text.length > 2 && !text.startsWith('{"error')) {
        return text;
      }
    } catch(e){
      console.warn(model, e.message);
    }
  }
  throw new Error('Сите модели паднаа. Обиди се пак.');
}

// ═══════════════════════════════════════════════════════════════
async function sendMsg(){
  if (STATE.busy) return;
  const text = msgBox.value.trim();
  if (!text) return;

  STATE.busy = true;
  sendBtn.disabled = true;
  msgBox.value = '';
  msgBox.style.height = 'auto';
  removeWelcome();

  addMsg('user', text);
  const th = addThinking();

  const agentCtx = STATE.selectedAgent 
    ? `[Using agent: ${STATE.selectedAgent.role}]\n\n` 
    : '';
  const system = agentCtx + 'You are Hugo Ultra, a highly capable AI agent. Reply in the same language as the user (Macedonian or English). Be concise, accurate, and helpful. Use markdown formatting.';

  try {
    const reply = await callLLM(text, system);
    th.remove();
    addMsg('hugo', reply);
    setStatus('Ready');
  } catch(e){
    th.remove();
    addErr('❌ ' + e.message);
    setStatus('Error');
  }

  STATE.busy = false;
  sendBtn.disabled = false;
  msgBox.focus();
}

function renderAgentCategories(){
  const container = $('agent-content');
  const html = Object.entries(AGENT_DATA).map(([cat, [emoji, desc, roles, mods]]) => {
    const count = roles.length * mods.length;
    return `
      <div class="agent-cat" onclick="openAgentCat('${cat}')">
        <div class="ico">${emoji}</div>
        <div class="info">
          <b>${cat}</b>
          <span>${desc} · ${count} agents</span>
        </div>
      </div>
    `;
  }).join('');
  container.innerHTML = `<div class="agent-grid">${html}</div>`;
}

window.openAgentCat = function(cat){
  const [emoji, desc, roles, mods] = AGENT_DATA[cat];
  const container = $('agent-content');
  let html = `<button class="primary" onclick="renderAgentCategories()" style="margin-bottom:12px">← Назад</button>`;
  html += `<div style="color:var(--txt2);font-size:12px;margin:8px 0">${emoji} ${desc}</div>`;
  html += '<div class="agent-list">';
  let count = 0;
  for (const role of roles) {
    for (const mod of mods) {
      const key = `${cat}_${role.toLowerCase().replace(/[^a-z0-9]/g,'_')}_${mod.toLowerCase().replace(/[^a-z0-9]/g,'_')}`;
      html += `
        <div class="agent-item" onclick="selectAgent('${key}')">
          <span class="dot-small"></span>
          <span>${esc(role)} <span style="color:var(--txt3)">(${esc(mod)})</span></span>
        </div>
      `;
      count++;
      if (count > 200) break;
    }
    if (count > 200) break;
  }
  html += '</div>';
  if (count > 200) html += `<div style="text-align:center;color:var(--txt3);font-size:12px;margin-top:12px">…and ${roles.length * mods.length - 200} more</div>`;
  container.innerHTML = html;
};

window.selectAgent = function(key){
  const a = AGENTS[key];
  if (!a) return;
  STATE.selectedAgent = a;
  closeModal('modal-agents');
  showToast(`✅ Избран: ${a.role}`, 2500);
  msgBox.focus();
};

function searchAgents(q){
  q = q.toLowerCase();
  if (!q) { renderAgentCategories(); return; }
  const results = [];
  for (const [k, a] of Object.entries(AGENTS)) {
    if (k.includes(q) || a.role.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)) {
      results.push(a);
      if (results.length > 100) break;
    }
  }
  const container = $('agent-content');
  if (!results.length) {
    container.innerHTML = '<div style="text-align:center;color:var(--txt3);padding:20px">Нема резултати</div>';
    return;
  }
  const html = results.map(a => {
    const key = Object.keys(AGENTS).find(k => AGENTS[k].id === a.id);
    return `
      <div class="agent-item" onclick="selectAgent('${key}')">
        <span class="dot-small"></span>
        <span>${esc(a.role)}</span>
      </div>
    `;
  }).join('');
  container.innerHTML = `<div class="agent-list">${html}</div>`;
}

// Export
function exportChat(){
  const txt = STATE.history.map(h => `[${h.role}] ${h.text}`).join('\n\n');
  const blob = new Blob([txt], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hugo-chat-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 Извезено');
}

async function init(){
  try {
    loaderText.textContent = 'Generating agents…';
    STATE.agentCount = generateAgents();
    $('agent-count').textContent = STATE.agentCount.toLocaleString();
    $('model-name').textContent = STATE.model;

    loaderText.textContent = `${STATE.agentCount.toLocaleString()} agents ready`;

    // Render history
    if (STATE.history.length) {
      STATE.history.forEach(h => addMsg(h.role, h.text, false));
    } else {
      showWelcome();
    }

    // Hide loader
    setTimeout(() => {
      loader.classList.add('off');
      msgBox.focus();
    }, 500);

    setStatus('Ready');
  } catch(e) {
    loaderText.textContent = 'Error: ' + e.message;
    console.error(e);
  }
}
