<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hugo AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#0a0a12;color:#e8e8ff;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px}
body{display:flex;flex-direction:column;position:fixed;width:100%;inset:0}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;
background:rgba(15,15,26,.95);backdrop-filter:blur(20px);border-bottom:1px solid #1e1e2e;
padding-top:calc(12px + env(safe-area-inset-top));z-index:10;flex-shrink:0}
.logo{width:34px;height:34px;border-radius:10px;
background:linear-gradient(135deg,#19d3ff,#7c5cff);display:flex;align-items:center;
justify-content:center;font-size:20px;box-shadow:0 0 20px rgba(25,211,255,.3)}
.info{flex:1}.info h1{font-size:16px;margin:0;color:#fff}
.sub{font-size:11px;color:#808aaa;margin-top:1px}
.icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
justify-content:center;font-size:18px;color:#9aa;background:none;border:none;cursor:pointer}
.icon:active{background:#1a1a2e}
#chat{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
.msg{margin:10px 0;padding:12px 16px;border-radius:18px;white-space:pre-wrap;
word-wrap:break-word;max-width:88%;font-size:15px;line-height:1.5;animation:mv .2s}
@keyframes mv{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.user{background:linear-gradient(135deg,#19d3ff,#00b8e6);color:#000;margin-left:auto;
border-bottom-right-radius:6px;font-weight:500}
.hugo{background:#1a1a2e;color:#e0e6ff;border-left:3px solid #7c5cff;border-bottom-left-radius:6px}
.hugo code{background:#0a0a12;padding:2px 6px;border-radius:4px;font-size:13px;color:#19d3ff;font-family:monospace}
.hugo pre{background:#0a0a12;padding:12px;border-radius:8px;overflow-x:auto;font-size:13px;margin:8px 0}
.hugo a{color:#19d3ff}
.think{color:#666;font-style:italic}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7c5cff;
margin:0 2px;animation:b 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
#input-area{padding:10px 12px calc(10px + env(safe-area-inset-bottom));
background:rgba(15,15,26,.95);backdrop-filter:blur(20px);border-top:1px solid #1e1e2e}
#input-row{display:flex;gap:8px;align-items:flex-end;background:#1a1a2e;border-radius:22px;
padding:6px 6px 6px 16px;border:1px solid #1e1e2e}
#input-row:focus-within{border-color:#19d3ff}
#msg{flex:1;padding:8px 0;border:none;background:transparent;color:#fff;font-size:16px;
resize:none;max-height:120px;outline:none;font-family:inherit}
#msg::placeholder{color:#666}
#send{width:38px;height:38px;border-radius:50%;flex-shrink:0;
background:linear-gradient(135deg,#19d3ff,#7c5cff);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:16px;font-weight:bold;border:none;
cursor:pointer;box-shadow:0 0 20px rgba(25,211,255,.3)}
#send:active{transform:scale(.92)}#send:disabled{opacity:.3}
.welcome{text-align:center;padding:40px 20px;color:#808aaa}
.welcome h2{color:#19d3ff;margin:0 0 8px;font-size:24px}
.sg{display:inline-block;padding:8px 14px;margin:6px 4px;background:#1a1a2e;
border-radius:16px;color:#c0c0d0;font-size:13px;cursor:pointer}
.sg:active{background:#1a2340;color:#19d3ff}
</style>
</head>
<body>

<header>
  <div class="logo">🤖</div>
  <div class="info"><h1>Hugo</h1><div class="sub" id="sub">Ready</div></div>
  <button class="icon" id="clear" title="Clear">🗑</button>
</header>

<div id="chat"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="msg" placeholder="Кажи што да направам…" rows="1"></textarea>
    <button id="send">➤</button>
  </div>
</div>

<script>
'use strict';
const chat = document.getElementById('chat');
const msgBox = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const sub = document.getElementById('sub');
let history = JSON.parse(localStorage.getItem('hugo_hist') || '[]');

function setSub(t){ sub.textContent = t; }
function scroll(){ chat.scrollTop = chat.scrollHeight; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function md(t){
  if (!t) return '';
  let h = esc(t);
  h = h.replace(/```(\\w*)\\n?([\\s\\S]*?)```/g, '<pre>$2</pre>');
  h = h.replace(/`([^`\\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\\*\\*([^*]+)\\*\\*/g, '<b>$1</b>');
  h = h.replace(/(https?:\\/\\/[^\\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  return h;
}
function add(w,t,save){
  const d = document.createElement('div'); d.className = 'msg ' + w; d.innerHTML = md(t);
  chat.appendChild(d); scroll();
  if (save !== false){ history.push({role:w, text:t}); saveHist(); }
  return d;
}
function saveHist(){ try { localStorage.setItem('hugo_hist', JSON.stringify(history.slice(-100))); } catch(e){} }
function thinking(){
  const d = document.createElement('div'); d.className = 'msg hugo think'; d.id = 'th';
  d.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  chat.appendChild(d); scroll(); return d;
}
function welcome(){
  if (document.getElementById('wc')) return;
  const w = document.createElement('div'); w.className = 'welcome'; w.id = 'wc';
  w.innerHTML = '<h2>Hugo 🤖</h2><p>Твојот AI агент. Работи веднаш.</p>' +
    '<p style="margin-top:20px;color:#666">Пробај:</p><div>' +
    '<span class="sg" onclick="qs(\\'Zdravo! Koj si ti?\\')">👋 Запознај се</span>' +
    '<span class="sg" onclick="qs(\\'Напиши краток Twitter пост за AI агенти\\')">✍️ Twitter пост</span>' +
    '<span class="sg" onclick="qs(\\'Објасни ми што е MCP протокол накратко\\')">📚 MCP</span>' +
    '<span class="sg" onclick="qs(\\'Направи план за денес, 5 задачи\\')">📋 План за денес</span>' +
    '</div>';
  chat.appendChild(w); scroll();
}
window.qs = t => { msgBox.value = t; send(); };

async function callLLM(messages){
  const models = ['openai', 'mistral', 'llama'];
  for (let attempt = 0; attempt < 3; attempt++){
    for (const model of models){
      try {
        const r = await fetch('https://text.pollinations.ai/openai', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({model, messages, private: true})
        });
        if (r.ok){
          const d = await r.json();
          return d.choices[0].message.content;
        }
      } catch(e){}
    }
    await new Promise(rs => setTimeout(rs, 1000));
  }
  return '[LLM unavailable — обиди се пак]';
}

async function send(text){
  if (sendBtn.disabled) return;
  text = (text || msgBox.value).trim();
  if (!text) return;
  msgBox.value = '';
  msgBox.style.height = 'auto';
  document.getElementById('wc')?.remove();
  add('user', text);
  const th = thinking();
  setSub('Thinking…');
  sendBtn.disabled = true;

  const msgs = [
    {role: 'system', content: 'You are Hugo, a helpful autonomous AI agent. Reply in the user\\'s language (Macedonian or English). Be concise, useful, and proactive. Never refuse without trying.'}
  ];
  // Include last 10 exchanges for context
  const recent = history.slice(-20);
  recent.forEach(h => msgs.push({role: h.role === 'hugo' ? 'assistant' : 'user', content: h.text}));
  // Ensure last is user
  if (msgs[msgs.length-1].role !== 'user') msgs.push({role: 'user', content: text});

  try {
    const reply = await callLLM(msgs);
    th.remove();
    add('hugo', reply);
    setSub('Ready');
  } catch(e){
    th.remove();
    add('hugo', '❌ ' + e.message);
    setSub('Error');
  }
  sendBtn.disabled = false;
  msgBox.focus();
}

sendBtn.onclick = () => send();
msgBox.addEventListener('input', () => {
  msgBox.style.height = 'auto';
  msgBox.style.height = Math.min(msgBox.scrollHeight, 120) + 'px';
});
msgBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
document.getElementById('clear').onclick = () => {
  if (!confirm('Избриши разговор?')) return;
  history = []; saveHist();
  chat.innerHTML = ''; welcome();
};

// Init
if (history.length){
  history.forEach(h => add(h.role, h.text, false));
} else {
  welcome();
}
msgBox.focus();
</script>
</body>
</html>
