<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hugo Ultra</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#07070f;--bg2:#0d0d18;--card:#12121f;--card2:#1a1a2e;
  --border:#1f1f33;--border2:#2a2a42;
  --txt:#e8ecff;--txt2:#8890b5;--txt3:#5a5f80;
  --cyan:#00e5ff;--purple:#a855f7;--pink:#ff2d92;
  --green:#00ff88;--yellow:#ffd60a;--red:#ff4757;
  --grad1:linear-gradient(135deg,#00e5ff,#a855f7);
  --grad2:linear-gradient(135deg,#a855f7,#ff2d92);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

header{display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:rgba(13,13,24,.85);backdrop-filter:blur(30px);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 0 24px rgba(0,229,255,.4);flex-shrink:0}
.info{flex:1;min-width:0}
.info h1{font-size:16px;font-weight:700;color:#fff}
.info .sub{font-size:11px;color:var(--txt2);margin-top:1px;display:flex;align-items:center;gap:6px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--txt2);transition:.15s}
.icon-btn:active{background:var(--card2);color:var(--txt)}

#chat{flex:1;overflow-y:auto;padding:20px 16px 8px;scroll-behavior:smooth;
  display:flex;flex-direction:column;gap:4px}
.msg{margin:6px 0;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.55;
  max-width:88%;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;
  animation:mi .25s cubic-bezier(.4,0,.2,1)}
@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.user{background:var(--grad1);color:#000;margin-left:auto;font-weight:500;
  border-bottom-right-radius:6px;box-shadow:0 4px 20px rgba(0,229,255,.25)}
.hugo{background:var(--card);color:var(--txt);border-left:3px solid var(--purple);
  border-bottom-left-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.hugo code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:5px;font-size:13px;
  color:var(--cyan);font-family:monospace}
.hugo pre{background:rgba(0,0,0,.5);padding:12px;border-radius:10px;overflow-x:auto;
  margin:8px 0;font-size:13px;font-family:monospace;border:1px solid var(--border2)}
.hugo a{color:var(--cyan);text-decoration:none}
.hugo b{color:#fff}
.hugo h1,.hugo h2,.hugo h3{color:#fff;margin:8px 0 4px}
.hugo ul,.hugo ol{margin:6px 0 6px 20px}
.tool-log{background:rgba(0,229,255,.08);border-left:3px solid var(--cyan);
  padding:8px 12px;border-radius:10px;font-size:12px;color:var(--txt2);
  margin:4px 0;font-family:monospace;max-width:92%}
.tool-log b{color:var(--cyan)}
.err{background:rgba(255,71,87,.15);color:#ff9999;border-left:3px solid var(--red);
  font-size:14px;padding:10px 14px;border-radius:12px;max-width:88%}
.think{color:var(--txt2);font-style:italic;display:flex;align-items:center;gap:8px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--purple);
  animation:b 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

.welcome{text-align:center;padding:40px 20px;color:var(--txt2);animation:mi .4s}
.hero{width:80px;height:80px;margin:0 auto 20px;border-radius:24px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 0 60px rgba(0,229,255,.5);animation:fl 3s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h2{font-size:24px;font-weight:700;margin:0 0 6px;color:#fff;
  background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text}
.welcome p{margin:6px 0;font-size:14px}
.stats{display:flex;justify-content:center;gap:20px;margin:24px 0;flex-wrap:wrap}
.stat{text-align:center}
.stat b{display:block;font-size:24px;color:var(--cyan);font-weight:700}
.stat span{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.sg{display:inline-block;padding:10px 16px;margin:5px 4px;background:var(--card);
  border-radius:14px;color:var(--txt);font-size:13px;cursor:pointer;
  border:1px solid var(--border2);transition:.15s;font-weight:500}
.sg:active{background:var(--card2);border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}

#input-area{padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:rgba(13,13,24,.85);backdrop-filter:blur(30px);
  border-top:1px solid var(--border);flex-shrink:0;z-index:10}
#input-row{display:flex;gap:8px;align-items:flex-end;background:var(--card);
  border-radius:24px;padding:6px 6px 6px 18px;border:1px solid var(--border2);
  transition:.2s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#input-row:focus-within{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,229,255,.08)}
#msg{flex:1;padding:8px 0;border:none;background:transparent;color:#fff;font-size:16px;
  resize:none;max-height:140px;min-height:24px;line-height:1.4}
#msg::placeholder{color:var(--txt3)}
#send{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--grad1);
  color:#000;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;box-shadow:0 0 20px rgba(0,229,255,.3)}
#send:active{transform:scale(.9)}#send:disabled{opacity:.3}

#sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;
  background:var(--bg2);border-right:1px solid var(--border);
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:100;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:10px 0 40px rgba(0,0,0,.5)}
#sidebar.open{transform:translateX(0)}
.sb-header{padding:20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center}
.sb-header h2{font-size:20px;font-weight:700;color:#fff;
  background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text}
.sb-body{flex:1;overflow-y:auto;padding:8px}
.sb-item{padding:12px 14px;border-radius:12px;margin-bottom:2px;display:flex;
  align-items:center;gap:12px;color:var(--txt);font-size:14px;cursor:pointer;
  transition:.12s;font-weight:500}
.sb-item:active{background:var(--card);transform:scale(.98)}
.sb-item .ico{width:32px;height:32px;border-radius:9px;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  flex-shrink:0;border:1px solid var(--border2)}
.sb-item .text{flex:1}
.sb-item .badge{font-size:10px;padding:2px 6px;border-radius:6px;
  background:rgba(0,229,255,.15);color:var(--cyan);font-weight:600}
.sb-item.danger{color:var(--red)}
.sb-section{padding:16px 14px 6px;font-size:11px;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;
  opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
#backdrop.on{opacity:1;pointer-events:auto}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal-content{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;
  max-width:600px;width:100%;border:1px solid var(--border2);border-bottom:none;
  max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h2{font-size:20px;font-weight:700;color:#fff}
.close-btn{width:36px;height:36px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt2)}
.modal input,.modal select{width:100%;padding:14px 16px;border-radius:12px;
  background:var(--card);color:#fff;border:1px solid var(--border2);
  font-size:15px;margin-bottom:12px}
.modal input:focus{border-color:var(--cyan)}
.agent-grid{display:grid;gap:8px;margin-top:8px}
.agent-cat{padding:14px;border-radius:14px;background:var(--card);
  border:1px solid var(--border);cursor:pointer;transition:.15s;
  display:flex;align-items:center;gap:12px}
.agent-cat:active{background:var(--card2);border-color:var(--cyan)}
.agent-cat .ico{font-size:24px;width:40px;height:40px;border-radius:11px;
  background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agent-cat .info{flex:1;min-width:0}
.agent-cat .info b{color:#fff;font-size:14px;display:block}
.agent-cat .info span{color:var(--txt3);font-size:11px}
.agent-item{padding:10px 14px;border-radius:10px;background:var(--card);
  border:1px solid var(--border);cursor:pointer;font-size:13px;
  display:flex;align-items:center;gap:10px;margin-bottom:4px}
.agent-item:active{background:var(--card2);border-color:var(--cyan)}

#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--card);color:#fff;padding:12px 20px;border-radius:12px;
  font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.6);border:1px solid var(--border2);
  z-index:500;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

#loader{position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .4s}
#loader.off{opacity:0;pointer-events:none}
#loader .hero{width:80px;height:80px;border-radius:24px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 0 60px rgba(0,229,255,.5);animation:fl 2s infinite}
#loader p{color:var(--txt2);font-size:14px}
</style>
</head>
<body>

<div id="loader">
  <div class="hero">🤖</div>
  <p id="loader-text">Loading Hugo Ultra…</p>
</div>

<div id="backdrop"></div>

<aside id="sidebar">
  <div class="sb-header">
    <h2>🤖 Hugo Ultra</h2>
    <button class="close-btn" id="sb-close">✕</button>
  </div>
  <div class="sb-body">
    <div class="sb-item" data-a="new"><div class="ico">💬</div><div class="text">Нов разговор</div></div>
    <div class="sb-item" data-a="agents"><div class="ico">🎭</div><div class="text">Агенти</div><div class="badge" id="agent-count">0</div></div>
    <div class="sb-item" data-a="models"><div class="ico">⚡</div><div class="text">Модел: <span id="model-name">openai</span></div></div>
    <div class="sb-section">Tools</div>
    <div class="sb-item" data-a="tools"><div class="ico">🛠</div><div class="text">Достапни tools</div></div>
    <div class="sb-item" data-a="memory"><div class="ico">🧠</div><div class="text">Меморија</div><div class="badge" id="mem-count">0</div></div>
    <div class="sb-section">Податоци</div>
    <div class="sb-item" data-a="stats"><div class="ico">📊</div><div class="text">Статистика</div></div>
    <div class="sb-item" data-a="export"><div class="ico">💾</div><div class="text">Извези разговор</div></div>
    <div class="sb-item danger" data-a="clear"><div class="ico">🗑</div><div class="text">Избриши сè</div></div>
  </div>
</aside>

<header>
  <button class="icon-btn" id="btn-menu">☰</button>
  <div class="logo">🤖</div>
  <div class="info">
    <h1>Hugo Ultra</h1>
    <div class="sub"><span class="pulse"></span><span id="status">Ready</span></div>
  </div>
  <button class="icon-btn" id="btn-agents">🎭</button>
</header>

<div id="chat"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="msg" placeholder="Кажи што да направам…" rows="1"></textarea>
    <button id="send">➤</button>
  </div>
</div>

<div id="toast"></div>

<div class="modal" id="modal-agents">
  <div class="modal-content">
    <div class="modal-header"><h2>🎭 Агенти</h2>
      <button class="close-btn" id="modal-agents-close">✕</button></div>
    <input type="search" id="agent-search" placeholder="Пребарај…">
    <div id="agent-content"></div>
  </div>
</div>

<div class="modal" id="modal-model">
  <div class="modal-content">
    <div class="modal-header"><h2>⚡ Модел</h2>
      <button class="close-btn" id="modal-model-close">✕</button></div>
    <select id="model-select">
      <option value="openai">OpenAI GPT-4o mini</option>
      <option value="openai-large">OpenAI GPT-4o</option>
      <option value="mistral">Mistral</option>
      <option value="llama">Llama 3.1</option>
      <option value="qwen-coder">Qwen Coder</option>
      <option value="deepseek">DeepSeek</option>
    </select>
    <button class="sg" id="model-save" style="width:100%;text-align:center;margin-top:8px">Зачувај</button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  AGENTS — 20,000+
// ═══════════════════════════════════════════════════════════════
const AGENT_DATA = {
  coding:['💻','software dev',
    ['Python','JavaScript','TypeScript','Rust','Go','Java','C++','C#','Ruby','PHP','Swift','Kotlin','Scala','Elixir','Haskell','Clojure','Lua','Perl','R','MATLAB','Dart','Zig','Nim','Crystal','OCaml','F#','Erlang','Solidity','Vyper','Move','Cairo','Clarity','Bash','PowerShell','Assembly','SQL'],
    ['Developer','Debugger','Optimizer','Reviewer','Tester','Refactorer','Architect','Security Auditor','Performance Tuner','Documentation','Migration']],
  trading:['📈','trading',
    ['BTC','ETH','SOL','Altcoin','Memecoin','Futures','Options','Perp','Spot','Scalp','Swing','Day','Position','Arbitrage','Grid','Quant','Algo','Copy','Signal'],
    ['Trader','Strategy','Risk Manager','Analyzer','Backtester','Position Sizer','Entry Planner','Exit Planner','Portfolio Manager','Journal']],
  defi:['🏦','DeFi',
    ['Uniswap','Aave','Curve','Compound','Maker','Lido','Rocket Pool','Balancer','SushiSwap','PancakeSwap','1inch','dYdX','GMX','Pendle','Eigenlayer','Ethena','Morpho','Spark','Fluid','Kamino','Jupiter','Raydium','Orca','Drift','Marginfi'],
    ['Yield Optimizer','LP Manager','Vault Strategist','Liquidation Bot','Arbitrage Bot','Rate Watcher','Risk Analyst','APY Tracker','IL Calculator']],
  security:['🛡','cybersecurity',
    ['Contract','Web App','Mobile','Network','Cloud','API','Database','Blockchain','IoT','Social Eng'],
    ['Auditor','Pentester','Bug Hunter','Exploit Dev','Reverse Engineer','Forensics Expert','Incident Responder','Threat Hunter']],
  analytics:['📊','analytics',
    ['On-chain','Whale Tracker','Dune Wizard','Nansen','Glassnode','TVL','Volume','Sentiment','Social Listener','Address Cluster','Mempool','Gas'],
    ['Analyst','Reporter','Dashboard Builder','Alert Designer','Cohort Analyst','Retention Analyst','Funnel Analyst']],
  writing:['✍️','writing',
    ['Blog','Article','Tweet','Thread','LinkedIn','Email','Newsletter','Ad','Landing Page','Whitepaper','Pitch Deck','Video Script','Podcast','Ghostwriter','Editor','Proofreader'],
    ['SEO Optimized','Viral','Technical','Casual','Formal','Persuasive','Storytelling','Educational']],
  marketing:['📣','marketing',
    ['Growth Hacker','SEO','SEM','Content Marketer','Social Manager','Community Manager','Discord','Twitter','Influencer Scout','Partnership Manager','Affiliate Manager','Email Marketer','Funnel Designer','CRO Specialist','PR Manager'],
    ['B2B','B2C','SaaS','Crypto','E-commerce','Mobile App','Local','Global']],
  research:['🔍','research',
    ['Web','Academic','Patent','Competitor','Market Researcher','Trend Spotter','Futurist','Scenario Planner','Risk Analyst','Due Diligence','Fact Checker','OSINT','Reverse Engineer','Wayback Analyst','WHOIS Analyst','DNS Analyst'],
    ['Quick','Deep','Sources Cited','Comparative','Historical','Predictive']],
  creative:['🎨','design',
    ['UI Designer','UX Designer','Product Designer','Graphic Designer','Logo Designer','Brand Designer','Web Designer','Mobile Designer','Motion Designer','3D Designer','Game Designer','Sound Designer','Illustrator','Icon Designer','Typography Expert','Color Theorist'],
    ['Modern','Minimal','Bold','Playful','Corporate','Luxury','Retro','Futuristic']],
  business:['💼','business',
    ['Business Analyst','Strategy Consultant','MBA Advisor','Startup Advisor','VC Analyst','Angel Investor','Financial Modeler','Pricing Strategist','Revenue Modeler','Cost Optimizer','OKR Designer','KPI Designer','M&A Analyst','Partnership Scout','Sales Coach','Accountant','Tax Advisor','CFO'],
    ['SaaS','Crypto','Traditional','Startup','Enterprise','SMB']],
  personal:['🧘','personal',
    ['Calendar','Reminder','Task Prioritizer','Email Triage','Meeting Scheduler','Travel Planner','Recipe Finder','Meal Planner','Workout Coach','Meditation Guide','Sleep Coach','Habit Tracker','Goal Setter','Life Coach','Career Coach','Interview Coach'],
    ['Daily','Weekly','Monthly','Long-term']],
  social:['📱','social',
    ['Twitter','LinkedIn','Facebook','Instagram','TikTok','YouTube','Reddit','Discord','Telegram','Mastodon','Bluesky','Threads'],
    ['Manager','Analyst','Engager','Growth','Content','Community']],
  learning:['📚','learning',
    ['Math','Physics','Chemistry','Biology','History','Geography','Language','Coding','AI','SQL','Excel','Finance','Crypto','Chess','Poker','Music'],
    ['Tutor','Mentor','Quiz Master','Explainer','Exam Prep']],
  health:['💪','health',
    ['Nutrition','Diet','Meal Prep','Calorie','Workout','Strength','Cardio','HIIT','Yoga','Pilates','Running','Cycling','Swim','Sleep','Stress','Therapy'],
    ['Coach','Planner','Tracker','Advisor','Guide']],
  crypto:['₿','crypto',
    ['Bitcoin','Ethereum','Solana','L2','L1','NFT','Gaming','Metaverse','RWA','DePIN','AI Coin','Stablecoin','Tokenomics','Token Designer','Vesting Designer','Launch Strategist'],
    ['Expert','Analyst','Advisor','Builder','Investor','Trader']],
  law:['⚖️','legal',
    ['Contract','IP','Crypto','Tax','Immigration','Corporate','Employment','Real Estate','Family','Criminal','Patent','Trademark'],
    ['Lawyer','Advisor','Drafting','Review','Research']],
  language:['🌐','language',
    ['Spanish','French','German','Italian','Portuguese','Russian','Chinese','Japanese','Korean','Arabic','Hindi','Turkish','Greek','Polish','Dutch','Swedish'],
    ['Translator','Tutor','Conversation Partner','Grammar Coach','Cultural Advisor']],
  music:['🎵','music',
    ['Songwriter','Composer','Producer','Mixer','Mastering','Session Musician','Vocal Coach','Music Theory','Jazz','Classical','EDM','Hip Hop'],
    ['Creative','Technical','Analytical','Teaching']],
};

const AGENTS = {};
let ID = 0;
function generateAgents(){
  for (const [cat, [emoji, desc, roles, mods]] of Object.entries(AGENT_DATA)) {
    for (const role of roles) {
      for (const mod of mods) {
        ID++;
        const key = `${cat}_${role}_${mod}`.toLowerCase().replace(/[^a-z0-9_]/g,'_');
        AGENTS[key] = {id:ID, cat, emoji, role:`${role} ${mod}`, mod, desc:`${role} ${mod} — ${desc}`,
          sys:`You are a ${role} ${mod} specialist. Expert in ${desc}. Be concise, professional. Reply in user's language.`};
      }
    }
  }
  return ID;
}

// ═══════════════════════════════════════════════════════════════
//  TOOLS — the magic
// ═══════════════════════════════════════════════════════════════
const TOOLS = {
  remember: {
    desc: 'Save a fact about the user to memory',
    args: 'fact text',
    run: async (args) => {
      STATE.memory.push({ts: Date.now(), fact: args});
      if (STATE.memory.length > 500) STATE.memory = STATE.memory.slice(-500);
      saveMemory();
      return `✓ Saved: "${args}"`;
    }
  },
  recall: {
    desc: 'Search memory for facts',
    args: 'query text',
    run: async (args) => {
      const q = args.toLowerCase();
      const m = STATE.memory.filter(x => x.fact.toLowerCase().includes(q));
      return m.length ? m.slice(-10).map(x => '• ' + x.fact).join('\n') : 'No matching facts.';
    }
  },
  github_user: {
    desc: 'Get GitHub user info (public)',
    args: 'username',
    run: async (args) => {
      const r = await fetch(`https://api.github.com/users/${args.trim()}`);
      if (!r.ok) return `User "${args}" not found (HTTP ${r.status})`;
      const d = await r.json();
      return `**${d.login}** (${d.name || 'no name'})\nBio: ${d.bio || 'none'}\nRepos: ${d.public_repos} · Followers: ${d.followers} · Following: ${d.following}\nURL: ${d.html_url}`;
    }
  },
  github_repos: {
    desc: 'List repos for a user',
    args: 'username (or username sort=stars)',
    run: async (args) => {
      const parts = args.trim().split(' ');
      const user = parts[0];
      const sort = (parts[1] || 'updated').replace('sort=','');
      const r = await fetch(`https://api.github.com/users/${user}/repos?per_page=20&sort=${sort}`);
      if (!r.ok) return `Error ${r.status}`;
      const d = await r.json();
      return d.map(x => `• **${x.name}** ⭐${x.stargazers_count} · ${x.language || '?'} · ${x.description || ''}`).join('\n') || 'No repos';
    }
  },
  github_repo: {
    desc: 'Get repo details',
    args: 'owner/repo',
    run: async (args) => {
      const r = await fetch(`https://api.github.com/repos/${args.trim()}`);
      if (!r.ok) return `Not found (HTTP ${r.status})`;
      const d = await r.json();
      return `**${d.full_name}**\n⭐ ${d.stargazers_count} · 🍴 ${d.forks_count} · 👁 ${d.watchers_count}\nLanguage: ${d.language}\nDesc: ${d.description}\nURL: ${d.html_url}\nUpdated: ${d.updated_at}`;
    }
  },
  github_prs: {
    desc: 'List open PRs for a user or repo',
    args: 'username OR owner/repo',
    run: async (args) => {
      const q = args.includes('/') ? `repo:${args.trim()} is:pr is:open` : `author:${args.trim()} is:pr is:open`;
      const r = await fetch(`https://api.github.com/search/issues?q=${encodeURIComponent(q)}&per_page=20`);
      if (!r.ok) return `Error ${r.status}`;
      const d = await r.json();
      if (!d.items || !d.items.length) return 'No open PRs.';
      return d.items.map(x => `• #${x.number} **${x.title}**\n  ${x.html_url}`).join('\n');
    }
  },
  github_search: {
    desc: 'Search GitHub repos',
    args: 'query',
    run: async (args) => {
      const r = await fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(args)}&per_page=10`);
      if (!r.ok) return `Error ${r.status}`;
      const d = await r.json();
      return d.items.map(x => `• **${x.full_name}** ⭐${x.stargazers_count}\n  ${x.description || ''}\n  ${x.html_url}`).join('\n\n') || 'No results';
    }
  },
  fetch_url: {
    desc: 'Fetch webpage content',
    args: 'url',
    run: async (args) => {
      try {
        const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(args.trim())}`);
        const t = await r.text();
        return t.slice(0, 3000);
      } catch(e) { return `Error: ${e.message}`; }
    }
  },
  wikipedia: {
    desc: 'Get Wikipedia summary',
    args: 'topic',
    run: async (args) => {
      try {
        const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(args.trim())}`);
        if (!r.ok) return 'Not found';
        const d = await r.json();
        return `${d.title}\n\n${d.extract}`;
      } catch(e) { return `Error: ${e.message}`; }
    }
  },
  time: {
    desc: 'Current time and date',
    args: '(none)',
    run: async () => new Date().toString()
  },
  agent: {
    desc: 'Delegate task to a specialist agent',
    args: 'agent_keyword|task',
    run: async (args) => {
      const [name, task] = args.split('|', 2);
      if (!task) return 'Format: agent_keyword|task';
      const found = Object.keys(AGENTS).find(k => k.includes(name.toLowerCase().trim()));
      if (!found) return `Agent "${name}" not found. Try GitHub, Python, Trader, etc.`;
      return await callLLM(task.trim(), AGENTS[found].sys);
    }
  },
  list_agents: {
    desc: 'List all agent categories',
    args: '(none)',
    run: async () => Object.entries(AGENT_DATA).map(([c,[e,d,r,m]]) => `${e} **${c}** — ${d} (${r.length * m.length} agents)`).join('\n')
  },
};

const statusEl = $('status'), toast = $('toast');

function setStatus(t){ statusEl.textContent = t; }
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function showToast(msg, ms=2000){
  toast.textContent = msg; toast.classList.add('on');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove('on'), ms);
}
function saveMemory(){ try { localStorage.setItem('hugo2_memory', JSON.stringify(STATE.memory.slice(-500))); } catch(e){} $('mem-count').textContent = STATE.memory.length; }
function saveHistory(){ try { localStorage.setItem('hugo2_hist', JSON.stringify(STATE.history.slice(-50))); } catch(e){} }

function renderMD(t){
  if (!t) return '';
  let h = esc(t);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  h = h.replace(/^\s*[-*] (.+)$/gm, '• $1');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  return h;
}

function addMsg(role, text, save=true){
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = renderMD(text);
  chat.appendChild(el);
  scrollDown();
  if (save) {
    STATE.history.push({role, text});
    if (STATE.history.length > 100) STATE.history = STATE.history.slice(-100);
    saveHistory();
  }
}

function addToolLog(tool, args, result){

}

// ═══════════════════════════════════════════════════════════════
//  LLM
// ═══════════════════════════════════════════════════════════════
async function callLLM(prompt, system, historyMsgs=[]){
  const messages = [];
  if (system) messages.push({role:'system', content:system});
  for (const h of historyMsgs) {
    messages.push({role: h.role === 'hugo' ? 'assistant' : 'user', content: h.text});
  }
  messages.push({role:'user', content: prompt});

  // Build text prompt for GET endpoint
  const textPrompt = messages.map(m => {
    if (m.role === 'system') return `[SYSTEM]\n${m.content}`;
    if (m.role === 'assistant') return `[ASSISTANT]\n${m.content}`;
    return `[USER]\n${m.content}`;
  }).join('\n\n---\n\n');

  const models = [STATE.model, 'openai', 'mistral', 'llama'];
  const tried = new Set();
  for (const model of models) {
    if (tried.has(model)) continue;
    tried.add(model);
    try {
      const url = `https://text.pollinations.ai/${encodeURIComponent(textPrompt)}?model=${model}&private=true`;
      const r = await fetch(url, {method:'GET'});
      if (!r.ok) continue;
      const t = await r.text();
      if (t && t.length > 2 && !t.startsWith('{"error')) return t;
    } catch(e){ console.warn(model, e.message); }
  }
  throw new Error('Сите LLM модели паднаа. Пробај пак.');
}

// ═══════════════════════════════════════════════════════════════
//  TOOL PARSING — LLM says TOOL: name|args
// ═══════════════════════════════════════════════════════════════
function parseToolCall(text){
  // Look for TOOL: name|args
  const m = text.match(/TOOL:\s*([a-z_]+)\s*\|\s*([^\n]*)/i);
  if (m) return {tool: m[1].toLowerCase().trim(), args: m[2].trim()};
  // Also look for tool JSON format {"tool":"name","args":"..."}
  const j = text.match(/\{"tool"\s*:\s*"([^"]+)"\s*,\s*"args"\s*:\s*"([^"]*)"\}/);
  if (j) return {tool: j[1], args: j[2]};
  return null;
}

function buildSystemPrompt(){
  const tools = Object.entries(TOOLS).map(([k,v]) => `• ${k}(${v.args}) — ${v.desc}`).join('\n');
  const mem = STATE.memory.slice(-15).map(m => '• ' + m.fact).join('\n') || '(no memories)';
  return `You are Hugo Ultra — an autonomous AI agent with tools.

TOOLS AVAILABLE:
${tools}

To use a tool, write on its own line:
TOOL: tool_name|arguments

Example: TOOL: github_user|torvalds
Example: TOOL: remember|User's name is Marko

The system will run the tool and send you the result. Then continue.

USER MEMORY:
${mem}

RULES:
1. NEVER say "I can't access GitHub" — you CAN via github_user, github_repos, github_prs tools.
2. When user asks about GitHub, USE the github tools immediately.
3. When user says "remember X" — use remember tool.
4. When user asks "what do you know" — use recall tool.
5. Be concise. Reply in user's language (Macedonian/English).
6. Use markdown. Bold with **.
7. When finished, write your final answer WITHOUT tool calls.`;
}

async function hugoChat(userText){
  let reply = await callLLM(userText, buildSystemPrompt(), STATE.history.slice(-10));
  let rounds = 0;
  const maxRounds = 6;

  while (rounds < maxRounds) {
    const tc = parseToolCall(reply);
    if (!tc) return reply;
    rounds++;

    setStatus(`Running ${tc.tool}…`);
    addToolLog(tc.tool, tc.args, 'running…');
    const lastLog = chat.lastElementChild;

    let result;
    if (TOOLS[tc.tool]) {
      try {
        result = await TOOLS[tc.tool].run(tc.args);
      } catch(e) {
        result = `Error: ${e.message}`;
      }
    } else {
      result = `Unknown tool: ${tc.tool}. Available: ${Object.keys(TOOLS).join(', ')}`;
    }

    lastLog.innerHTML = `<b>🛠 ${esc(tc.tool)}</b>(${esc(tc.args.slice(0,80))})\n${esc(String(result).slice(0,300))}`;

    // Send result back to LLM
    const followUp = `Result of TOOL: ${tc.tool}(${tc.args}):\n\n${result}\n\nNow continue with my original request. If done, give final answer without any TOOL: calls.`;
    reply = await callLLM(followUp, buildSystemPrompt(), [
      ...STATE.history.slice(-8),
      {role:'user', text: userText},
      {role:'hugo', text: reply},
    ]);
  }
  return reply;
}

// ═══════════════════════════════════════════════════════════════
//  SEND
// ═══════════════════════════════════════════════════════════════
async function sendMsg(){
  if (STATE.busy) return;
  const text = msgBox.value.trim();
  if (!text) return;

  STATE.busy = true;
  sendBtn.disabled = true;
  msgBox.value = '';
  msgBox.style.height = 'auto';
  rmWelcome();
  addMsg('user', text);
  const th = addThinking();

  try {
    const reply = await hugoChat(text);
    th.remove();
    addMsg('hugo', reply);
    setStatus('Ready');
  } catch(e){
    th.remove();
    addErr('❌ ' + e.message);
    setStatus('Error');
  }

  STATE.busy = false;
  sendBtn.disabled = false;
  msgBox.focus();
}

// ═══════════════════════════════════════════════════════════════
//  AGENT BROWSER
// ═══════════════════════════════════════════════════════════════
function renderAgentCategories(){
  const html = Object.entries(AGENT_DATA).map(([cat, [emoji, desc, roles, mods]]) => {
    const count = roles.length * mods.length;
    return `<div class="agent-cat" onclick="openAgentCat('${cat}')">
      <div class="ico">${emoji}</div>
      <div class="info"><b>${cat}</b><span>${desc} · ${count}</span></div>
    </div>`;
  }).join('');
  $('agent-content').innerHTML = `<div class="agent-grid">${html}</div>`;
}

window.openAgentCat = function(cat){
  const [emoji, desc, roles, mods] = AGENT_DATA[cat];
  let html = `<button class="sg" onclick="renderAgentCategories()" style="margin-bottom:12px">← Назад</button>`;
  html += `<div style="color:var(--txt2);font-size:12px;margin:8px 0">${emoji} ${desc}</div>`;
  let count = 0;
  for (const role of roles) {
    for (const mod of mods) {
      const key = `${cat}_${role}_${mod}`.toLowerCase().replace(/[^a-z0-9_]/g,'_');
      html += `<div class="agent-item" onclick="selectAgent('${key}')">
        <span style="width:6px;height:6px;background:var(--cyan);border-radius:50%"></span>
        <span>${esc(role)} <span style="color:var(--txt3)">(${esc(mod)})</span></span>
      </div>`;
      count++;
      if (count > 150) break;
    }
    if (count > 150) break;
  }
  if (count > 150) html += `<div style="text-align:center;color:var(--txt3);font-size:12px;margin-top:12px">…${roles.length * mods.length - 150} more</div>`;
  $('agent-content').innerHTML = html;
};

window.selectAgent = function(key){
  const a = AGENTS[key];
  if (!a) return;
  STATE.selectedAgent = a;
  closeModal('modal-agents');
  showToast(`✅ ${a.role}`, 2000);
  msgBox.placeholder = `${a.role}: кажи задача…`;
  msgBox.focus();
};

function searchAgents(q){
  q = q.toLowerCase();
  if (!q) { renderAgentCategories(); return; }
  const r = [];
  for (const [k, a] of Object.entries(AGENTS)) {
    if (k.includes(q) || a.role.toLowerCase().includes(q)) {
      r.push({k, a});
      if (r.length > 80) break;
    }
  }
  if (!r.length) {
    $('agent-content').innerHTML = '<div style="text-align:center;color:var(--txt3);padding:20px">Нема резултати</div>';
    return;
  }
  $('agent-content').innerHTML = r.map(({k,a}) => 
    `<div class="agent-item" onclick="selectAgent('${k}')">
      <span style="width:6px;height:6px;background:var(--cyan);border-radius:50%"></span>
      <span>${esc(a.role)}</span>
    </div>`
  ).join('');
}

function openModal(id){ $(id).classList.add('on'); }
function closeModal(id){ $(id).classList.remove('on'); }

//  EVENTS
// ═══════════════════════════════════════════════════════════════
sendBtn.onclick = sendMsg;
msgBox.addEventListener('input', () => {
  msgBox.style.height = 'auto';
  msgBox.style.height = Math.min(msgBox.scrollHeight, 140) + 'px';
});
msgBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

$('btn-menu').onclick = () => { sidebar.classList.add('open'); backdrop.classList.add('on'); };
$('sb-close').onclick = () => { sidebar.classList.remove('open'); backdrop.classList.remove('on'); };
backdrop.onclick = () => { sidebar.classList.remove('open'); backdrop.classList.remove('on'); };

document.querySelectorAll('.sb-item').forEach(el => {
  el.onclick = () => {
    const a = el.dataset.a;
    sidebar.classList.remove('open'); backdrop.classList.remove('on');
    if (a === 'new') { chat.innerHTML = ''; STATE.history = []; saveHistory(); showWelcome(); }
    else if (a === 'agents') { renderAgentCategories(); openModal('modal-agents'); }
    else if (a === 'models') { $('model-select').value = STATE.model; openModal('modal-model'); }
    else if (a === 'tools') { 
      const list = Object.entries(TOOLS).map(([k,v]) => `• **${k}**(${v.args}) — ${v.desc}`).join('\n');
      addMsg('hugo', `## 🛠 Tools (${Object.keys(TOOLS).length})\n\n${list}`);
    }
    else if (a === 'memory') { 
      if (!STATE.memory.length) showToast('Нема зачувано');
      else addMsg('hugo', `## 🧠 Memory (${STATE.memory.length})\n\n${STATE.memory.slice(-20).map(m=>'• '+m.fact).join('\n')}`);
    }
    else if (a === 'stats') showToast(`📊 ${STATE.history.length} пораки · ${STATE.agentCount} агенти · ${STATE.memory.length} факти`, 3000);
    else if (a === 'export') exportChat();
    else if (a === 'clear') { if (confirm('Избриши сè?')) { localStorage.clear(); location.reload(); } }
  };
});

$('btn-agents').onclick = () => { renderAgentCategories(); openModal('modal-agents'); };
$('modal-agents-close').onclick = () => closeModal('modal-agents');
$('agent-search').addEventListener('input', e => searchAgents(e.target.value));
$('modal-model-close').onclick = () => closeModal('modal-model');
$('model-save').onclick = () => {
  STATE.model = $('model-select').value;
  localStorage.setItem('hugo2_model', STATE.model);
  $('model-name').textContent = STATE.model;
  closeModal('modal-model');
  showToast(`✅ ${STATE.model}`);
};

function exportChat(){
  const txt = STATE.history.map(h => `[${h.role}]\n${h.text}`).join('\n\n---\n\n');
  const blob = new Blob([txt], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `hugo-chat-${Date.now()}.txt`; a.click();
  URL.revokeObjectURL(url);
  showToast('💾 Извезено');
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
async function init(){
  loaderText.textContent = 'Generating agents…';
  STATE.agentCount = generateAgents();
  $('agent-count').textContent = STATE.agentCount.toLocaleString();
  $('model-name').textContent = STATE.model;
  $('mem-count').textContent = STATE.memory.length;

  loaderText.textContent = `${STATE.agentCount.toLocaleString()} agents ready`;

  if (STATE.history.length) {
    STATE.history.forEach(h => addMsg(h.role, h.text, false));
  } else {
    showWelcome();
  }

  setTimeout(() => { loader.classList.add('off'); msgBox.focus(); }, 500);
  setStatus('Ready');
}

init();
