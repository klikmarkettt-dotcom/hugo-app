<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS — Ultra Agent</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d18;--card:#12121f;--card2:#1a1a2e;--border:#1f1f33;
  --txt:#e8ecff;--txt2:#8890b5;--txt3:#5a5f80;--cyan:#00e5ff;--purple:#a855f7;
  --green:#00ff88;--red:#ff4757;--yellow:#ffd60a;--grad1:linear-gradient(135deg,#00e5ff,#a855f7);
  --grad2:linear-gradient(135deg,#a855f7,#ff2d92)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* HEADER */
header{display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));background:rgba(13,13,24,.9);
  backdrop-filter:blur(30px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad1);display:flex;
  align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  box-shadow:0 0 24px rgba(0,229,255,.35)}
.info{flex:1;min-width:0}
.info h1{font-size:16px;font-weight:700;color:#fff}
.info .sub{font-size:11px;color:var(--txt2);margin-top:1px;display:flex;align-items:center;gap:6px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--txt2)}
.icon-btn:active{background:var(--card2);color:var(--txt)}

/* CHAT */
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.msg{margin:4px 0;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.55;
  max-width:88%;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;animation:mi .2s}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.user{background:var(--grad1);color:#000;margin-left:auto;font-weight:500;border-bottom-right-radius:6px}
.jarvis{background:var(--card);color:var(--txt);border-left:3px solid var(--purple);border-bottom-left-radius:6px}
.jarvis code{background:rgba(0,0,0,.4);padding:2px 5px;border-radius:4px;font-size:13px;color:var(--cyan);font-family:monospace;word-break:break-all}
.jarvis pre{background:rgba(0,0,0,.5);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:12px;font-family:monospace;border:1px solid var(--border)}
.jarvis a{color:var(--cyan);text-decoration:none}
.jarvis b{color:#fff}
.jarvis img{max-width:100%;border-radius:12px;margin:8px 0;display:block;box-shadow:0 4px 20px rgba(0,229,255,.3)}
.img-wrap{position:relative;display:inline-block;overflow:hidden;border-radius:12px;margin:8px 0}
.img-wrap img{max-width:100%;border-radius:12px;display:block}
.img-wrap::after{content:'';position:absolute;bottom:0;right:0;width:140px;height:35px;background:var(--card);z-index:2}
.tool-log{background:rgba(0,229,255,.08);border-left:3px solid var(--cyan);padding:6px 10px;
  border-radius:8px;font-size:11px;color:var(--txt2);margin:3px 0;font-family:monospace;max-width:92%;line-height:1.3}
.tool-log b{color:var(--cyan)}
.think{color:var(--txt2);font-style:italic;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--purple);animation:b 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.sys{color:var(--txt3);font-size:11px;text-align:center;margin:6px 0;font-style:italic}
.sys b{color:var(--cyan)}

/* WELCOME */
.welcome{text-align:center;padding:30px 16px;color:var(--txt2)}
.welcome .hero{width:80px;height:80px;margin:0 auto 16px;border-radius:26px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 0 50px rgba(0,229,255,.5);animation:fl 3s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h2{font-size:24px;font-weight:700;margin:0 0 4px;background:var(--grad1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome p{margin:4px 0;font-size:13px}
.stats{display:flex;justify-content:center;gap:20px;margin:20px 0;flex-wrap:wrap}
.stat{text-align:center}
.stat b{display:block;font-size:22px;color:var(--cyan);font-weight:700}
.stat span{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.sg{display:inline-block;padding:8px 13px;margin:4px 3px;background:var(--card);
  border-radius:12px;color:var(--txt);font-size:12px;cursor:pointer;
  border:1px solid var(--border);font-weight:500}
.sg:active{background:var(--card2);border-color:var(--cyan);color:var(--cyan)}

/* INPUT */
#input-area{padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:rgba(13,13,24,.9);backdrop-filter:blur(30px);border-top:1px solid var(--border);flex-shrink:0}
#input-row{display:flex;gap:6px;align-items:flex-end;background:var(--card);
  border-radius:22px;padding:5px 5px 5px 16px;border:1px solid var(--border)}
#input-row:focus-within{border-color:var(--cyan)}
#msg{flex:1;padding:8px 0;border:none;background:transparent;color:#fff;font-size:16px;
  resize:none;max-height:120px;min-height:22px;line-height:1.4}
#msg::placeholder{color:var(--txt3)}
#send{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--grad1);
  color:#000;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
#send:active{transform:scale(.9)}#send:disabled{opacity:.4}
#mic{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--card2);color:var(--cyan);
  display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border)}
#mic:active{transform:scale(.9)}#mic.on{background:var(--red);color:#fff;border-color:var(--red);animation:p 1s infinite}

/* SIDEBAR */
#sidebar{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:85vw;background:var(--bg2);
  border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .3s;z-index:100;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#sidebar.open{transform:translateX(0)}
.sb-header{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sb-header h2{font-size:18px;font-weight:700;background:var(--grad1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-body{flex:1;overflow-y:auto;padding:8px}
.sb-item{padding:11px 13px;border-radius:10px;margin-bottom:2px;display:flex;align-items:center;
  gap:10px;color:var(--txt);font-size:14px;cursor:pointer;font-weight:500}
.sb-item:active{background:var(--card)}
.sb-item .ico{width:30px;height:30px;border-radius:8px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:1px solid var(--border)}
.sb-item .text{flex:1}
.sb-item .badge{font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(0,229,255,.15);color:var(--cyan);font-weight:600}
.sb-item.danger{color:var(--red)}
.sb-section{padding:14px 13px 5px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.close-btn{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:16px;color:var(--txt2);cursor:pointer}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#backdrop.on{opacity:1;pointer-events:auto}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--card);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);border:1px solid var(--border);z-index:500;opacity:0;transition:.3s;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal-content{background:var(--bg2);border-radius:18px 18px 0 0;padding:18px;max-width:600px;width:100%;
  border:1px solid var(--border);border-bottom:none;max-height:82vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h2{font-size:18px;font-weight:700;color:#fff}
.modal input{width:100%;padding:12px 14px;border-radius:10px;background:var(--card);
  color:#fff;border:1px solid var(--border);font-size:14px;margin-bottom:10px}
</style>
</head>
<body>

<div id="backdrop"></div>
<aside id="sidebar">
  <div class="sb-header"><h2>🤖 JARVIS</h2>
    <button class="close-btn" id="sb-close">✕</button></div>
  <div class="sb-body">
    <div class="sb-item" data-a="new"><div class="ico">💬</div><div class="text">Нов разговор</div></div>
    <div class="sb-item" data-a="help"><div class="ico">❓</div><div class="text">Што можам</div></div>
    <div class="sb-section">Модули</div>
    <div class="sb-item" data-a="cognition"><div class="ico">🧠</div><div class="text">Свест (Cognition)</div><div class="badge">ON</div></div>
    <div class="sb-item" data-a="memory"><div class="ico">💾</div><div class="text">Меморија</div><div class="badge" id="mem-count">0</div></div>
    <div class="sb-item" data-a="vision"><div class="ico">👁</div><div class="text">Очи (Vision)</div><div class="badge">ON</div></div>
    <div class="sb-item" data-a="business"><div class="ico">📊</div><div class="text">Бизнис</div><div class="badge">ON</div></div>
    <div class="sb-section">Глас</div>
    <div class="sb-item" data-a="tts"><div class="ico">🔊</div><div class="text">Auto-speak</div><div class="badge" id="tts-badge">OFF</div></div>
    <div class="sb-section">Податоци</div>
    <div class="sb-item" data-a="export"><div class="ico">💾</div><div class="text">Извези меморија</div></div>
    <div class="sb-item danger" data-a="clear"><div class="ico">🗑</div><div class="text">Избриши сè</div></div>
  </div>
</aside>

<header>
  <button class="icon-btn" id="btn-menu">☰</button>
  <div class="logo">🤖</div>
  <div class="info"><h1>JARVIS Ultra</h1>
    <div class="sub"><span class="pulse"></span><span id="status">Ready</span></div></div>
  <button class="icon-btn" id="btn-help">❓</button>
</header>

<div id="chat"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="msg" placeholder="Кажи што да направам…" rows="1"></textarea>
    <button id="mic">🎤</button>
    <button id="send">➤</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const chat = $('chat'), msgBox = $('msg'), sendBtn = $('send'), micBtn = $('mic');
const sidebar = $('sidebar'), backdrop = $('backdrop');
const statusEl = $('status'), toast = $('toast');

function setStatus(t){ statusEl.textContent = t }
function scrollDown(){ chat.scrollTop = chat.scrollHeight }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]) }
function showToast(m, ms=2000){ toast.textContent = m; toast.classList.add('on'); clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.classList.remove('on'), ms); }

// ═══ STATE ═══
const STATE = {
  history: JSON.parse(localStorage.getItem('jarvis_hist') || '[]'),
  memory: JSON.parse(localStorage.getItem('jarvis_mem') || '[]'),
  learnings: JSON.parse(localStorage.getItem('jarvis_learn') || '[]'),
  tasks: JSON.parse(localStorage.getItem('jarvis_tasks') || '[]'),
  speak: localStorage.getItem('jarvis_speak') === '1',
  lang: localStorage.getItem('jarvis_lang') || 'mk-MK',
  busy: false,
  listening: false,
  cognition: { plan: true, replan: true, reflect: true },
};
function save(){
  try {
    localStorage.setItem('jarvis_hist', JSON.stringify(STATE.history.slice(-100)));
    localStorage.setItem('jarvis_mem', JSON.stringify(STATE.memory.slice(-1000)));
    localStorage.setItem('jarvis_learn', JSON.stringify(STATE.learnings.slice(-500)));
    localStorage.setItem('jarvis_tasks', JSON.stringify(STATE.tasks.slice(-100)));
    localStorage.setItem('jarvis_speak', STATE.speak ? '1' : '0');
  } catch(e){}
  if ($('mem-count')) $('mem-count').textContent = STATE.memory.length;
}

// ═══ TTS ═══
function speak(text){
  if (!STATE.speak || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[#*`_\[\]()]/g,'').slice(0, 400));
    u.lang = STATE.lang;
    u.rate = 1.05;
    const voices = speechSynthesis.getVoices();
    const match = voices.find(v => v.lang.startsWith(STATE.lang.split('-')[0]));
    if (match) u.voice = match;
    speechSynthesis.speak(u);
  } catch(e){}
}

// ═══ STT ═══
let recognition = null;
function initSTT(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = false; r.interimResults = true; r.lang = STATE.lang;
  r.onresult = (e) => {
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
    }
    if (final){ msgBox.value = final; setTimeout(() => sendMsg(), 200); }
    else { msgBox.value = e.results[e.results.length-1][0].transcript; }
  };
  r.onend = () => { STATE.listening = false; micBtn.classList.remove('on'); setStatus('Ready'); };
  r.onerror = () => { STATE.listening = false; micBtn.classList.remove('on'); setStatus('Ready'); };
  return r;
}
micBtn.onclick = () => {
  if (!recognition) recognition = initSTT();
  if (!recognition){ showToast('❌ Нема STT'); return; }
  if (STATE.listening){ recognition.stop(); STATE.listening = false; micBtn.classList.remove('on'); }
  else {
    recognition.lang = STATE.lang;
    try { recognition.start(); STATE.listening = true; micBtn.classList.add('on'); setStatus('🎤 Слушам…'); }
    catch(e){ showToast('❌ ' + e.message); }
  }
};

// ═══════════════════════════════════════════════════════════
//  🧠 COGNITION ENGINE — Planning + Reasoning + Reflection
// ═══════════════════════════════════════════════════════════
async function cognitionPlan(userText){
  const mem = STATE.memory.slice(-10).map(m => '• ' + m.fact).join('
') || '(none)';
  const prompt = `Ти си JARVIS — автономен агент со СВЕСТ.

КОРИСНИКОВА ЗАДАЧА: "${userText}"

МЕМОРИЈА:
${mem}

ТВОЈА ЗАДАЧА:
1. РАЗЛОЖИ ја задачата на под-задачи (макс 5)
2. За секоја под-задача кажи што ти треба
3. Одлучи: можеш ли сам или треба tool
4. Ако треба tool, кажи кој

ФОРМАТ:
ПЛАН:
1. [под-задача] — [tool или "reasoning"]
2. ...

ОДЛУКА: [tool_name|argument ИЛИ "reason" ИЛИ "final_answer"]

Примери:
- "Отвори YouTube" → ОДЛУКА: browse|https://youtube.com
- "Колку е 5+5" → ОДЛУКА: execute_js|5+5
- "Напиши песна" → ОДЛУКА: reason|Напиши песна за пролет
- "Кој си ти" → ОДЛУКА: reason|Кој си ти
- "Запамети дека сум Марко" → ОДЛУКА: remember|User is Marko

Одговори САМО со:
ПЛАН: ...
ОДЛУКА: ...`;

  const reply = await callLLM(prompt);
  return reply || 'ОДЛУКА: reason|' + userText;
}

// ═══════════════════════════════════════════════════════════
//  🛠 TOOLS
// ═══════════════════════════════════════════════════════════
const TOOLS = {
  // COGNITION
  plan: { desc: "Разложи задача", args: "task",
    run: async (t) => cognitionPlan(t) },
  reason: { desc: "Размисли со LLM", args: "query",
    run: async (q) => callLLM(q) || '❌ LLM недостапен' },
  reflect: { desc: "Анализирај што научи", args: "",
    run: async () => {
      const recent = STATE.memory.slice(-20);
      return `🪞 **Рефлексија:**

Научени факти: ${recent.length}
Задачи: ${STATE.tasks.length}
Сесии: ${STATE.history.length}

Последни 5:
${recent.slice(-5).map(m => '• ' + m.fact).join('
')}`;
    }
  },

  // MEMORY
  remember: { desc: "Запамети факт", args: "fact",
    run: async (f) => {
      STATE.memory.push({ts: Date.now(), fact: f.trim()});
      if (STATE.memory.length > 1000) STATE.memory = STATE.memory.slice(-1000);
      save();
      return `📌 Запаметено: "${f}"`;
    }
  },
  recall: { desc: "Пребарај меморија", args: "query",
    run: async (q) => {
      q = q.toLowerCase().trim();
      const m = STATE.memory.filter(x => !q || x.fact.toLowerCase().includes(q));
      if (!m.length) return `💾 Нема спомени${q?' за "'+q+'"':''}.`;
      return `💾 **${m.length} спомени:**

` + m.slice(-15).map(x => '• ' + x.fact).join('
');
    }
  },
  learn: { desc: "Научи skill од GitHub", args: "owner/repo",
    run: async (repo) => {
      repo = repo.trim();
      try {
        const r = await fetch(`https://api.github.com/repos/${repo}`);
        if (!r.ok) return `❌ Repo не е најден: ${repo}`;
        const info = await r.json();
        let readme = '';
        for (const br of [info.default_branch, 'main', 'master']){
          try {
            const rr = await fetch(`https://raw.githubusercontent.com/${repo}/${br}/README.md`);
            if (rr.ok){ readme = await rr.text(); break; }
          } catch(e){}
        }
        const lines = readme.split('
');
        let learned = 0;
        for (const line of lines){
          const m = line.match(/^\s*[-*]\s+\[([^\]]+)\]\(([^)]+)\)\s*[-–—:]\s*(.+)$/);
          if (m && m[1].length > 2 && m[3].length > 8){
            STATE.learnings.push({name: m[1], desc: m[3].slice(0,150), url: m[2], source: repo});
            learned++;
          }
        }
        save();
        return `🎓 Научи **${learned}** skills од **${repo}**.
Вкупно: ${STATE.learnings.length}`;
      } catch(e){ return '❌ ' + e.message; }
    }
  },

  // VISION
  browse: { desc: "Отвори URL", args: "url",
    run: async (url) => {
      url = url.trim();
      if (!url.startsWith('http')) url = 'https://' + url;
      window.open(url, '_blank');
      return `🌐 Отворено: ${url}`;
    }
  },
  see: { desc: "Види што има на страница", args: "url",
    run: async (url) => {
      if (!url) return '❌ Кажи URL.';
      url = url.trim();
      if (!url.startsWith('http')) url = 'https://' + url;
      try {
        const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
        const t = await r.text();
        const clean = t.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
        return `👁 **${url}**

${clean.slice(0, 2500)}`;
      } catch(e){ return '❌ ' + e.message; }
    }
  },
  search_web: { desc: "Пребарај на интернет", args: "query",
    run: async (q) => {
      q = q.trim();
      const url = `https://duckduckgo.com/?q=${encodeURIComponent(q)}`;
      window.open(url, '_blank');
      return `🔍 Пребарувам: **${q}**

[Отвори рачно](${url})`;
    }
  },
  generate_image: { desc: "Генерирај слика", args: "prompt",
    run: async (p) => {

// ═══ LLM ═══
const OLLAMA_TUNNEL = "https://italics-childlike-ravine.ngrok-free.dev";
const OLLAMA_MODEL = "qwen2.5:3b";

async function callOllama(prompt){
  try {
    const r = await fetch(`${OLLAMA_TUNNEL}/v1/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true'
      },
      body: JSON.stringify({
        model: OLLAMA_MODEL,
        messages: [
          { role: 'system', content: 'Ти си JARVIS, асистент. Одговарај кратко и на македонски.' },
          { role: 'user', content: prompt }
        ],
        stream: false
      })
    });
    if (!r.ok) return null;
    const data = await r.json();
    const t = data?.choices?.[0]?.message?.content;
    if (t && t.length > 0) return t;
  } catch(e){ console.warn('Ollama failed:', e); }
  return null;
}

async function callPollinations(prompt){
  const enc = encodeURIComponent(prompt);
  for (const url of [
    `https://text.pollinations.ai/${enc}?model=openai&private=true`,
    `https://text.pollinations.ai/${enc}?model=mistral&private=true`,
    `https://text.pollinations.ai/${enc}`
  ]){
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const t = await r.text();
      if (t && t.length > 2 && !t.startsWith('{"error') && !t.startsWith('<!')) return t;
    } catch(e){}
  }
  return null;
}

async function callLLM(prompt){
  const local = await callOllama(prompt);
  if (local) return local;
  return await callPollinations(prompt);
}

// ═══ PARSE JARVIS DECISION ═══
function parseDecision(text){
  if (!text) return null;
  const m = text.match(/ОДЛУКА:\s*([a-z_]+)\s*\|?\s*([^
]*)/i);
  if (m) return { tool: m[1].toLowerCase().trim(), args: (m[2] || '').trim() };
  // Also look for TOOL: format
  const m2 = text.match(/TOOL:\s*([a-z_]+)\s*\|\s*([^
]*)/i);
  if (m2) return { tool: m2[1].toLowerCase().trim(), args: m2[2].trim() };
  return null;
}

// ═══ JARVIS AGENT LOOP ═══
async function runJarvis(userText){
  setStatus('🧠 Размислувам…');
  addToolLog('plan', userText.slice(0, 60));

  // 1. PLAN
  const plan = await cognitionPlan(userText);
  console.log('PLAN:', plan);

  // 2. DECIDE
  const decision = parseDecision(plan);
  if (!decision){
    // LLM gave direct answer
    return plan;
  }

  // 3. EXECUTE
  if (!TOOLS[decision.tool]){
    return `⚠️ Непознат tool: ${decision.tool}. Достапни: ${Object.keys(TOOLS).join(', ')}`;
  }

  setStatus(`🛠 ${decision.tool}…`);
  addToolLog(decision.tool, decision.args);

  let result;
  try {
    result = await TOOLS[decision.tool].run(decision.args);
  } catch(e){
    result = `❌ ${e.message}`;
  }

  // 4. OBSERVE + REFLECT (if result is not enough)
  if (decision.tool !== 'remember' && decision.tool !== 'recall' && decision.tool !== 'reason' && result && !result.startsWith('__')){
    // Save task
    STATE.tasks.push({ts: Date.now(), task: userText, tool: decision.tool, result: String(result).slice(0, 300)});
    if (STATE.tasks.length > 100) STATE.tasks = STATE.tasks.slice(-100);
    save();
  }

  return result;
}

// ═══ UI ═══
function renderMD(t){
  if (!t) return '';
  const im = t.match(/__IMAGE__(.+)__PROMPT__(.+)$/);
  if (im) return `🎨 **${esc(im[2])}**

<div class="img-wrap"><img src="${esc(im[1])}" loading="lazy"></div>`;
  let h = esc(t);
  h = h.replace(/```(\w*)
?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`
]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^\s*[-*] (.+)$/gm, '• $1');
  h = h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  return h;
}

function addMsg(role, text, saveIt=true){

  if (saveIt){ STATE.history.push({role, text, ts: Date.now()}); save(); }
}

  el.innerHTML = `<b>🧠 ${esc(tool)}</b>(${esc(String(args).slice(0,80))})`;

}

function rmWelcome(){ $('welcome')?.remove(); }
window.qs = t => { msgBox.value = t; sendMsg(); };

async function sendMsg(){
  if (STATE.busy) return;
  const text = msgBox.value.trim();
  if (!text) return;
  STATE.busy = true;
  sendBtn.disabled = true;
  msgBox.value = '';
  msgBox.style.height = 'auto';
  rmWelcome();
  addMsg('user', text);
  const th = addThinking();

  try {
    const result = await runJarvis(text);
    th.remove();
    addMsg('jarvis', result);
    speak(result);
    setStatus('Ready');
  } catch(e){
    th.remove();
    addMsg('jarvis', '❌ ' + e.message);
  }
  STATE.busy = false;
  sendBtn.disabled = false;
  msgBox.focus();
}

sendBtn.onclick = sendMsg;
msgBox.addEventListener('input', () => { msgBox.style.height = 'auto'; msgBox.style.height = Math.min(msgBox.scrollHeight, 120) + 'px'; });
msgBox.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
