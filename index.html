<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hugo AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d18;--card:#12121f;--card2:#1a1a2e;--border:#1f1f33;
  --txt:#e8ecff;--txt2:#8890b5;--txt3:#5a5f80;--cyan:#00e5ff;--purple:#a855f7;
  --green:#00ff88;--red:#ff4757;--grad1:linear-gradient(135deg,#00e5ff,#a855f7)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));background:rgba(13,13,24,.9);
  backdrop-filter:blur(30px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad1);display:flex;
  align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.info{flex:1}.info h1{font-size:16px;font-weight:700;color:#fff}
.info .sub{font-size:11px;color:var(--txt2);margin-top:1px;display:flex;align-items:center;gap:6px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt2)}
.icon-btn:active{background:var(--card2);color:var(--txt)}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.msg{margin:4px 0;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.55;
  max-width:88%;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;animation:mi .2s}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.user{background:var(--grad1);color:#000;margin-left:auto;font-weight:500;border-bottom-right-radius:6px}
.hugo{background:var(--card);color:var(--txt);border-left:3px solid var(--purple);border-bottom-left-radius:6px}
.hugo code{background:rgba(0,0,0,.4);padding:2px 5px;border-radius:4px;font-size:13px;color:var(--cyan);font-family:monospace;word-break:break-all}
.hugo pre{background:rgba(0,0,0,.5);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:12px;font-family:monospace;border:1px solid var(--border)}
.hugo a{color:var(--cyan);text-decoration:none}
.hugo b{color:#fff}
.hugo img{max-width:100%;border-radius:12px;margin:8px 0;display:block;box-shadow:0 4px 20px rgba(0,229,255,.3)}
.img-wrap{position:relative;display:inline-block;overflow:hidden;border-radius:12px;margin:8px 0}
.img-wrap img{max-width:100%;border-radius:12px;display:block}
.img-wrap::after{content:'';position:absolute;bottom:0;right:0;width:140px;height:35px;background:var(--card);z-index:2}
.tool-log{background:rgba(0,229,255,.08);border-left:3px solid var(--cyan);padding:6px 10px;
  border-radius:8px;font-size:11px;color:var(--txt2);margin:3px 0;font-family:monospace;max-width:92%;line-height:1.3}
.tool-log b{color:var(--cyan)}
.think{color:var(--txt2);font-style:italic;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--purple);animation:b 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.sys{color:var(--txt3);font-size:11px;text-align:center;margin:6px 0;font-style:italic}
.welcome{text-align:center;padding:30px 16px;color:var(--txt2)}
.welcome .hero{width:70px;height:70px;margin:0 auto 16px;border-radius:22px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 0 40px rgba(0,229,255,.4);animation:fl 3s infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.welcome h2{font-size:22px;font-weight:700;margin:0 0 4px;background:var(--grad1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome p{margin:4px 0;font-size:13px}
.sg{display:inline-block;padding:8px 13px;margin:4px 3px;background:var(--card);border-radius:12px;
  color:var(--txt);font-size:12px;cursor:pointer;border:1px solid var(--border);font-weight:500}
.sg:active{background:var(--card2);color:var(--cyan)}
#input-area{padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:rgba(13,13,24,.9);backdrop-filter:blur(30px);border-top:1px solid var(--border);flex-shrink:0}
#input-row{display:flex;gap:6px;align-items:flex-end;background:var(--card);border-radius:22px;
  padding:5px 5px 5px 16px;border:1px solid var(--border)}
#input-row:focus-within{border-color:var(--cyan)}
#msg{flex:1;padding:8px 0;border:none;background:transparent;color:#fff;font-size:16px;resize:none;max-height:120px;min-height:22px;line-height:1.4}
#msg::placeholder{color:var(--txt3)}
#send{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--grad1);color:#000;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
#send:active{transform:scale(.9)}#send:disabled{opacity:.4}
#mic{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--card2);color:var(--cyan);
  display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border)}
#mic:active{transform:scale(.9)}#mic.on{background:var(--red);color:#fff;border-color:var(--red);animation:p 1s infinite}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:var(--bg2);
  border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .3s;z-index:100;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#sidebar.open{transform:translateX(0)}
.sb-header{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sb-header h2{font-size:18px;font-weight:700;background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-body{flex:1;overflow-y:auto;padding:8px}
.sb-item{padding:11px 13px;border-radius:10px;margin-bottom:2px;display:flex;align-items:center;gap:10px;color:var(--txt);font-size:14px;cursor:pointer;font-weight:500}
.sb-item:active{background:var(--card)}
.sb-item .ico{width:30px;height:30px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:1px solid var(--border)}
.sb-item .text{flex:1}
.sb-item .badge{font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(0,229,255,.15);color:var(--cyan);font-weight:600}
.sb-item.danger{color:var(--red)}
.sb-section{padding:14px 13px 5px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.close-btn{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt2);cursor:pointer}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#backdrop.on{opacity:1;pointer-events:auto}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--card);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);border:1px solid var(--border);z-index:500;opacity:0;transition:.3s;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="backdrop"></div>
<aside id="sidebar">
  <div class="sb-header"><h2>🤖 Hugo</h2>
    <button class="close-btn" id="sb-close">✕</button></div>
  <div class="sb-body">
    <div class="sb-item" data-a="new"><div class="ico">💬</div><div class="text">Нов разговор</div></div>
    <div class="sb-item" data-a="help"><div class="ico">❓</div><div class="text">Што можам</div></div>
    <div class="sb-item" data-a="memory"><div class="ico">🧠</div><div class="text">Меморија</div><div class="badge" id="mem-count">0</div></div>
    <div class="sb-section">Глас</div>
    <div class="sb-item" data-a="tts"><div class="ico">🔊</div><div class="text">Auto-speak</div><div class="badge" id="tts-badge">OFF</div></div>
    <div class="sb-item" data-a="lang"><div class="ico">🌐</div><div class="text">Јазик</div><div class="badge" id="lang-badge">MK</div></div>
    <div class="sb-section">Опасно</div>
    <div class="sb-item danger" data-a="clear"><div class="ico">🗑</div><div class="text">Избриши сè</div></div>
  </div>
</aside>

<header>
  <button class="icon-btn" id="btn-menu">☰</button>
  <div class="logo">🤖</div>
  <div class="info"><h1>Hugo AI</h1>
    <div class="sub"><span class="pulse"></span><span id="status">Ready</span></div></div>
  <button class="icon-btn" id="btn-help">❓</button>
</header>

<div id="chat"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="msg" placeholder="Кажи што да направам…" rows="1"></textarea>
    <button id="mic">🎤</button>
    <button id="send">➤</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const chat = $('chat'), msgBox = $('msg'), sendBtn = $('send'), micBtn = $('mic');
const sidebar = $('sidebar'), backdrop = $('backdrop');
const statusEl = $('status'), toast = $('toast');

function setStatus(t){ statusEl.textContent = t }
function scrollDown(){ chat.scrollTop = chat.scrollHeight }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]) }
function showToast(m, ms=2000){ toast.textContent = m; toast.classList.add('on'); clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.classList.remove('on'), ms); }

// ═══ STATE ═══
const STATE = {
  history: JSON.parse(localStorage.getItem('hugoR_hist') || '[]'),
  memory: JSON.parse(localStorage.getItem('hugoR_memory') || '[]'),
  speak: localStorage.getItem('hugoR_speak') === '1',
  lang: localStorage.getItem('hugoR_lang') || 'mk-MK',
  busy: false,
  listening: false,
};
function save(){
  try {
    localStorage.setItem('hugoR_hist', JSON.stringify(STATE.history.slice(-50)));
    localStorage.setItem('hugoR_memory', JSON.stringify(STATE.memory.slice(-500)));
    localStorage.setItem('hugoR_speak', STATE.speak ? '1' : '0');
    localStorage.setItem('hugoR_lang', STATE.lang);
  } catch(e){}
  if ($('mem-count')) $('mem-count').textContent = STATE.memory.length;
}

// ═══ TTS ═══
function speak(text){
  if (!STATE.speak || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[#*`_\[\]()]/g,'').slice(0, 300));
    u.lang = STATE.lang;
    u.rate = 1.05;
    const voices = speechSynthesis.getVoices();
    const match = voices.find(v => v.lang.startsWith(STATE.lang.split('-')[0]));
    if (match) u.voice = match;
    speechSynthesis.speak(u);
  } catch(e){}
}

// ═══ STT ═══
let recognition = null;
function initSTT(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = false; r.interimResults = true; r.lang = STATE.lang;
  r.onresult = (e) => {
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
    }
    if (final){ msgBox.value = final; setTimeout(() => sendMsg(), 200); }
    else { msgBox.value = e.results[e.results.length-1][0].transcript; }
  };
  r.onend = () => { STATE.listening = false; micBtn.classList.remove('on'); setStatus('Ready'); };
  r.onerror = () => { STATE.listening = false; micBtn.classList.remove('on'); setStatus('Ready'); };
  return r;
}
micBtn.onclick = () => {
  if (!recognition) recognition = initSTT();
  if (!recognition){ showToast('❌ Нема STT'); return; }
  if (STATE.listening){ recognition.stop(); STATE.listening = false; micBtn.classList.remove('on'); }
  else {
    recognition.lang = STATE.lang;
    try { recognition.start(); STATE.listening = true; micBtn.classList.add('on'); setStatus('🎤 Слушам…'); }
    catch(e){ showToast('❌ ' + e.message); }
  }
};

// ═══════════════════════════════════════════════════════════
//  🛠 10 УНИВЕРЗАЛНИ TOOLS
// ═══════════════════════════════════════════════════════════
const TOOLS = {
  // 1. Отвори URL
  open_url: {
    desc: "Отвори URL во нов таб",
    args: "https://example.com",
    run: async (url) => {
      url = url.trim();
      if (!url.startsWith('http')) url = 'https://' + url;
      window.open(url, '_blank');
      return `🌐 Отворено: ${url}`;
    }
  },
  // 2. Земи содржина од URL
  fetch_url: {
    desc: "Земи текст од веб-страница",
    args: "url",
    run: async (url) => {
      url = url.trim();
      if (!url.startsWith('http')) url = 'https://' + url;
      try {
        const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
        const t = await r.text();
        const clean = t.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
        return clean.slice(0, 2500);
      } catch(e) { return `❌ Не можам да преземам: ${e.message}`; }
    }
  },
  // 3. Пребарај веб
  search_web: {
    desc: "Пребарај на DuckDuckGo",
    args: "query",
    run: async (q) => {
      q = q.trim();
      const url = `https://duckduckgo.com/?q=${encodeURIComponent(q)}`;
      window.open(url, '_blank');
      return `🔍 Пребарувам: **${q}**\n\nОтворено во нов таб. Ако не се отвори, кликни: [DuckDuckGo](${url})`;
    }
  },
  // 4. Пребарај YouTube
  search_youtube: {
    desc: "Пребарај видеа на YouTube",
    args: "query",
    run: async (q) => {
      q = q.trim();
      const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;
      window.open(url, '_blank');
      return `▶️ Барам на YouTube: **${q}**\n\n[Отвори рачно](${url})`;
    }
  },
  // 5. Изврши JavaScript
  execute_js: {
    desc: "Пресметај или изврши JS код",
    args: "код или математички израз",
    run: async (code) => {
      try {
        const result = Function('"use strict"; return (' + code + ')')();
        return `💻 \`${code}\` = **${result}**`;
      } catch(e) {
        return `❌ Грешка во кодот: ${e.message}`;
      }
    }
  },
  // 6. Запамети
  remember: {
    desc: "Запамети факт",
    args: "факт",
    run: async (fact) => {
      STATE.memory.push({ts: Date.now(), fact: fact.trim()});
      if (STATE.memory.length > 500) STATE.memory = STATE.memory.slice(-500);
      save();
      return `✓ Запаметено: "${fact}"`;
    }
  },
  // 7. Сети се
  recall: {
    desc: "Пребарај во меморија",
    args: "клуч",
    run: async (q) => {
      q = q.toLowerCase().trim();
      const m = STATE.memory.filter(x => !q || x.fact.toLowerCase().includes(q));
      if (!m.length) return `🧠 Нема спомени${q?' за "'+q+'"':''}.`;
      return `🧠 **${m.length} спомени:**\n\n` + m.slice(-15).map(x => '• ' + x.fact).join('\n');
    }
  },
  // 8. Време
  current_time: {
    desc: "Тековно време и датум",
    args: "",
    run: async () => `🕐 ${new Date().toLocaleString('mk-MK', {dateStyle:'full', timeStyle:'short'})}`
  },
  // 9. Кажи
  speak: {
    desc: "Кажи текст гласно",
    args: "текст",
    run: async (t) => {
      const wasSpeak = STATE.speak;
      STATE.speak = true;
      speak(t);
      STATE.speak = wasSpeak;
      return `🔊 Кажано: "${t}"`;
    }
  },
  // 10. Изрази мисла преку LLM
  llm_think: {
    desc: "Размисли со LLM за комплексни работи",
    args: "прашање или задача",
    run: async (q) => {
      const reply = await callLLM(q);
      return reply || '❌ LLM недостапен';
    }
  }
};

// ═══════════════════════════════════════════════════════════
//  🧠 LLM за размислување
// ═══════════════════════════════════════════════════════════
async function callLLM(prompt){
  const enc = encodeURIComponent(prompt);
  for (const url of [
    `https://text.pollinations.ai/${enc}?model=openai&private=true`,
    `https://text.pollinations.ai/${enc}?model=mistral&private=true`,
    `https://text.pollinations.ai/${enc}`
  ]){
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const t = await r.text();
      if (t && t.length > 2 && !t.startsWith('{"error') && !t.startsWith('<!')) return t;
    } catch(e){}
  }
  return null;
}

// ═══════════════════════════════════════════════════════════
//  🤖 LLM ОДЛУЧУВА КОЈ TOOL ДА ГО КОРИСТИ
// ═══════════════════════════════════════════════════════════
function buildToolPrompt(userText){
  const toolsList = Object.entries(TOOLS).map(([k,v]) => `- ${k}: ${v.desc} (args: ${v.args||'none'})`).join('\n');
  const mem = STATE.memory.slice(-10).map(m => '• ' + m.fact).join('\n') || '(none)';
  return `Ти си Hugo agent. Одлучи кој tool да го користиш за задачата.

ДОСТАПНИ TOOLS:
${toolsList}

ФОРМАТ НА ОДГОВОР (само ова, ништо друго):
TOOL: tool_name|argument

Примери:
- "Отвори YouTube" → TOOL: open_url|https://youtube.com
- "Пребарај Python tutorial" → TOOL: search_web|Python tutorial
- "Најди видео за AI" → TOOL: search_youtube|AI video
- "Колку е 25*4" → TOOL: execute_js|25*4
- "Запамети дека сум Марко" → TOOL: remember|User is Marko
- "Што знаеш за мене" → TOOL: recall|
- "Колку е часот" → TOOL: current_time|
- "Кој си ти" → TOOL: llm_think|Кој си ти
- "Напиши песна" → TOOL: llm_think|Напиши песна за пролет
- "Здраво" → TOOL: llm_think|Здраво

АКО НЕ Е ЈАСНО КОЈ TOOL — користи llm_think со оригиналниот текст.

ЗАДАЧА: "${userText}"

КОРИСНИКОВА МЕМОРИЈА:
${mem}

Одговори САМО со: TOOL: tool_name|argument`;
}

function parseTool(text){
  if (!text) return null;
  const m = text.match(/TOOL:\s*([a-z_]+)\s*\|\s*([^\n]*)/i);
  if (m) return { tool: m[1].toLowerCase().trim(), args: m[2].trim() };
  return null;
}

async function runAgent(userText){
  setStatus('🧠 Размислувам…');
  const decisionPrompt = buildToolPrompt(userText);
  const decision = await callLLM(decisionPrompt);

  if (!decision){
    return '❌ Не можам да размислам. Пробај пак.';
  }

  const tc = parseTool(decision);
  if (!tc){
    // LLM didn't return TOOL: format — use direct reply
    return decision;
  }

  if (!TOOLS[tc.tool]){
    return `⚠️ Непознат tool: ${tc.tool}. Пробај: ${Object.keys(TOOLS).join(', ')}`;
  }

  setStatus(`🛠 ${tc.tool}…`);
  addToolLog(tc.tool, tc.args);

  try {
    const result = await TOOLS[tc.tool].run(tc.args);
    return result;
  } catch(e){
    return `❌ Грешка: ${e.message}`;
  }
}

// ═══ UI ═══
function renderMD(t){
  if (!t) return '';
  const im = t.match(/__IMAGE__(.+)__PROMPT__(.+)$/);
  if (im) return `🎨 **${esc(im[2])}**\n\n<div class="img-wrap"><img src="${esc(im[1])}" loading="lazy"></div>`;
  let h = esc(t);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^\s*[-*] (.+)$/gm, '• $1');
  h = h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  return h;
}

function addMsg(role, text, saveIt=true){
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = renderMD(text);
  chat.appendChild(el);
  scrollDown();
  if (saveIt){ STATE.history.push({role, text}); save(); }
}

function addToolLog(tool, args){
  const el = document.createElement('div');
  el.className = 'tool-log';
  el.innerHTML = `<b>🛠 ${esc(tool)}</b>(${esc(String(args).slice(0,80))})`;
  chat.appendChild(el);
  scrollDown();
}

function addThinking(){
  const el = document.createElement('div');
  el.className = 'msg hugo think';
  el.id = 'thinking';
  el.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span> размислувам…';

}

function rmWelcome(){ $('welcome')?.remove(); }
window.qs = t => { msgBox.value = t; sendMsg(); };

async function sendMsg(){
  if (STATE.busy) return;
  const text = msgBox.value.trim();
  if (!text) return;
  STATE.busy = true;
  sendBtn.disabled = true;
  msgBox.value = '';
  msgBox.style.height = 'auto';
  rmWelcome();
  addMsg('user', text);
  const th = addThinking();

  try {
    const result = await runAgent(text);
    th.remove();
    addMsg('hugo', result);
    speak(result);
    setStatus('Ready');
  } catch(e){
    th.remove();
    addMsg('hugo', '❌ ' + e.message);
  }
  STATE.busy = false;
  sendBtn.disabled = false;
  msgBox.focus();
}

sendBtn.onclick = sendMsg;
msgBox.addEventListener('input', () => { msgBox.style.height = 'auto'; msgBox.style.height = Math.min(msgBox.scrollHeight, 120) + 'px'; });
msgBox.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } });

// Sidebar
$('btn-menu').onclick = () => { sidebar.classList.add('open'); backdrop.classList.add('on'); };
$('sb-close').onclick = () => { sidebar.classList.remove('open'); backdrop.classList.remove('on'); };
backdrop.onclick = () => { sidebar.classList.remove('open'); backdrop.classList.remove('on'); };
$('btn-help').onclick = () => addMsg('hugo', helpText());

function helpText(){
  const toolsList = Object.entries(TOOLS).map(([k,v]) => `• **${k}** — ${v.desc}`).join('\n');
  return `🛠 **10 универзални tools:**\n\n${toolsList}\n\n💡 **Како работам:** LLM размислува кој tool да го користи за задачата. Не е потребно да учам нов tool за секоја задача.`;
}

document.querySelectorAll('.sb-item').forEach(el => {
  el.onclick = () => {
    const a = el.dataset.a;
    sidebar.classList.remove('open'); backdrop.classList.remove('on');
    if (a === 'new'){ chat.innerHTML=''; STATE.history=[]; save(); showWelcome(); }
    else if (a === 'help'){ addMsg('hugo', helpText()); }
    else if (a === 'memory'){
      if (!STATE.memory.length) addMsg('hugo', '🧠 Меморија е празна.');
      else addMsg('hugo', `🧠 **${STATE.memory.length} спомени:**\n\n` + STATE.memory.slice(-30).reverse().map(m => '• ' + m.fact).join('\n'));
    }
    else if (a === 'tts'){
      STATE.speak = !STATE.speak;
      save();
      $('tts-badge').textContent = STATE.speak ? 'ON' : 'OFF';
      $('tts-badge').style.background = STATE.speak ? 'rgba(0,255,136,.2)' : 'rgba(0,229,255,.15)';
      $('tts-badge').style.color = STATE.speak ? 'var(--green)' : 'var(--cyan)';
    }
    else if (a === 'lang'){
      const langs = ['mk-MK','en-US','sr-RS','de-DE'];
      const names = ['MK','EN','SR','DE'];
      const idx = langs.indexOf(STATE.lang);
      const next = (idx + 1) % langs.length;
      STATE.lang = langs[next];
      save();
      $('lang-badge').textContent = names[next];
    }
    else if (a === 'clear'){ if (confirm('Избриши сè?')){ localStorage.clear(); location.reload(); } }
  };
});

// Init
function init(){
  if (STATE.speak){
    $('tts-badge').textContent = 'ON';
    $('tts-badge').style.background = 'rgba(0,255,136,.2)';
    $('tts-badge').style.color = 'var(--green)';
  }
  $('lang-badge').textContent = {'mk-MK':'MK','en-US':'EN','sr-RS':'SR','de-DE':'DE'}[STATE.lang] || 'MK';
  $('mem-count').textContent = STATE.memory.length;

  if (STATE.history.length){ STATE.history.forEach(h => addMsg(h.role, h.text, false)); }
  else { showWelcome(); }

  // Preload voices
  if ('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }
}

init();

const HIGGSFIELD_API = "https://api.higgsfield.ai/v1";

async function higgsfieldCall(endpoint, payload){
  const key = localStorage.getItem('higgsfield_key');
  if (!key){
    return "❌ Higgsfield API key не е внесен. Отвори Settings → Higgsfield API Key, или оди на https://cloud.higgsfield.ai";
  }
  try {
    const r = await fetch(HIGGSFIELD_API + endpoint, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    if (!r.ok) {
      const err = await r.text();
      return `❌ Higgsfield error ${r.status}: ${err.slice(0,200)}`;
    }
    return await r.json();
  } catch(e) {
    return "❌ " + e.message;
  }
}
