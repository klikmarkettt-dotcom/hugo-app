<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hugo AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d18;--card:#12121f;--card2:#1a1a2e;--border:#1f1f33;
  --txt:#e8ecff;--txt2:#8890b5;--txt3:#5a5f80;--cyan:#00e5ff;--purple:#a855f7;
  --green:#00ff88;--red:#ff4757;--yellow:#ffd60a;--grad1:linear-gradient(135deg,#00e5ff,#a855f7)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

#install{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .5s}
#install.off{opacity:0;pointer-events:none}
#install .hero{width:90px;height:90px;border-radius:26px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:50px;
  box-shadow:0 0 60px rgba(0,229,255,.5);animation:fl 3s ease-in-out infinite;margin-bottom:20px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#install h1{font-size:26px;font-weight:800;color:#fff;margin:0 0 6px}
#install h1 span{background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#install .tagline{color:var(--txt2);font-size:13px;margin-bottom:28px}
#install .progress{width:240px;height:4px;background:var(--card);border-radius:2px;overflow:hidden;margin-bottom:14px}
#install .progress-fill{height:100%;background:var(--grad1);transition:width .2s;border-radius:2px}
#install .status-text{color:var(--txt3);font-size:11px;font-family:monospace;height:16px;margin-bottom:20px}

header{display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));background:rgba(13,13,24,.9);
  backdrop-filter:blur(30px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad1);display:flex;
  align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 0 20px rgba(0,229,255,.3)}
.info{flex:1;min-width:0}
.info h1{font-size:16px;font-weight:700;color:#fff}
.info .sub{font-size:11px;color:var(--txt2);margin-top:1px;display:flex;align-items:center;gap:6px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt2)}
.icon-btn:active{background:var(--card2);color:var(--txt)}

#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.msg{margin:4px 0;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.55;
  max-width:88%;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;animation:mi .2s}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.user{background:var(--grad1);color:#000;margin-left:auto;font-weight:500;border-bottom-right-radius:6px}
.hugo{background:var(--card);color:var(--txt);border-left:3px solid var(--purple);border-bottom-left-radius:6px}
.hugo code{background:rgba(0,0,0,.4);padding:2px 5px;border-radius:4px;font-size:13px;color:var(--cyan);font-family:monospace}
.hugo pre{background:rgba(0,0,0,.5);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:12px;font-family:monospace;border:1px solid var(--border)}
.hugo a{color:var(--cyan);text-decoration:none}
.hugo b{color:#fff}
.hugo h1,.hugo h2,.hugo h3{color:#fff;margin:6px 0 3px}
.hugo ul,.hugo ol{margin:4px 0 4px 18px}
.hugo img{max-width:100%;border-radius:12px;margin:8px 0;box-shadow:0 4px 20px rgba(0,229,255,.3);display:block}
.tool-log{background:rgba(0,229,255,.08);border-left:3px solid var(--cyan);padding:6px 10px;
  border-radius:8px;font-size:11px;color:var(--txt2);margin:3px 0;font-family:monospace;max-width:92%;line-height:1.3}
.tool-log b{color:var(--cyan)}
.err{background:rgba(255,71,87,.15);color:#ff9999;border-left:3px solid var(--red);font-size:13px;padding:8px 12px;border-radius:10px;max-width:88%}
.think{color:var(--txt2);font-style:italic;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--purple);animation:b 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.sys{color:var(--txt3);font-size:11px;text-align:center;margin:6px 0;font-style:italic}
.sys b{color:var(--cyan)}
.welcome{text-align:center;padding:30px 16px;color:var(--txt2)}
.welcome .hero{width:70px;height:70px;margin:0 auto 16px;border-radius:22px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:0 0 40px rgba(0,229,255,.4);animation:fl 3s infinite}
.welcome h2{font-size:22px;font-weight:700;margin:0 0 4px;color:#fff;
  background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome p{margin:4px 0;font-size:13px}
.sg{display:inline-block;padding:8px 13px;margin:4px 3px;background:var(--card);border-radius:12px;
  color:var(--txt);font-size:12px;cursor:pointer;border:1px solid var(--border);font-weight:500}
.sg:active{background:var(--card2);color:var(--cyan)}

#input-area{padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:rgba(13,13,24,.9);backdrop-filter:blur(30px);border-top:1px solid var(--border);flex-shrink:0}
#input-row{display:flex;gap:6px;align-items:flex-end;background:var(--card);border-radius:22px;
  padding:5px 5px 5px 16px;border:1px solid var(--border);transition:.2s}
#input-row:focus-within{border-color:var(--cyan)}
#msg{flex:1;padding:8px 0;border:none;background:transparent;color:#fff;font-size:16px;resize:none;max-height:120px;min-height:22px;line-height:1.4}
#msg::placeholder{color:var(--txt3)}
#send{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--grad1);color:#000;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
#send:active{transform:scale(.9)}#send:disabled{opacity:.4}

#sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:var(--bg2);
  border-right:1px solid var(--border);transform:translateX(-100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#sidebar.open{transform:translateX(0)}
.sb-header{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sb-header h2{font-size:18px;font-weight:700;background:var(--grad1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-body{flex:1;overflow-y:auto;padding:8px}
.sb-item{padding:11px 13px;border-radius:10px;margin-bottom:2px;display:flex;align-items:center;
  gap:10px;color:var(--txt);font-size:14px;cursor:pointer;font-weight:500}
.sb-item:active{background:var(--card)}
.sb-item .ico{width:30px;height:30px;border-radius:8px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:1px solid var(--border)}
.sb-item .text{flex:1}
.sb-item .badge{font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(0,229,255,.15);color:var(--cyan);font-weight:600}
.sb-item.danger{color:var(--red)}
.sb-section{padding:14px 13px 5px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.close-btn{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:16px;color:var(--txt2);cursor:pointer}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#backdrop.on{opacity:1;pointer-events:auto}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal-content{background:var(--bg2);border-radius:18px 18px 0 0;padding:18px;max-width:600px;width:100%;
  border:1px solid var(--border);border-bottom:none;max-height:82vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h2{font-size:18px;font-weight:700;color:#fff}
.modal input,.modal select{width:100%;padding:12px 14px;border-radius:10px;background:var(--card);
  color:#fff;border:1px solid var(--border);font-size:14px;margin-bottom:10px}
.agent-cat{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.agent-cat .ico{font-size:22px;width:36px;height:36px;border-radius:10px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agent-cat .info{flex:1}
.agent-cat .info b{color:#fff;font-size:13px;display:block}
.agent-cat .info span{color:var(--txt3);font-size:10px}
.agent-item{padding:9px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);
  cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:3px}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--card);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);border:1px solid var(--border);z-index:500;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<script>

    a:['Manager','Strategist','Analyst','Optimizer','Planner','Researcher']},
  research:{e:'🔍',d:'research',p:['Web','Academic','Patent','Competitor','Market','Trend','Futurist','Risk','Fact Check','OSINT','Reverse Engineering','Wayback','WHOIS','DNS'],
    a:['Researcher','Analyst','Reporter','Verifier','Investigator']},
  creative:{e:'🎨',d:'design',p:['UI','UX','Product','Graphic','Logo','Brand','Web','Mobile','Motion','3D','Game','Sound','Illustration','Typography','Animation','Video'],

const AGENTS={};let AGENT_ID=0;
function generateAgents(){
  const list=[];
  for(const[cat,data]of Object.entries(AGENT_DATA)){
    for(const p of data.p){
      for(const a of data.a){
        AGENT_ID++;
        const key=`${cat}_${p}_${a}`.toLowerCase().replace(/[^a-z0-9_]/g,'_');
        AGENTS[key]={id:AGENT_ID,cat,emoji:data.e,role:`${p} ${a}`,desc:`${p} ${a} — ${data.d}`,
          sys:`You are a ${p} ${a} expert in ${data.d}. Concise. Reply in user's language.`};
        list.push(key);
      }
    }
  }
  return list;
}

// ═══ LEARN ═══
const LEARN_SOURCES=[
  'e2b-dev/awesome-ai-agents','punkpeye/awesome-mcp-servers','kyrolabs/awesome-langchain',
  'steven2358/awesome-generative-ai','humanloop/awesome-llm-apps','tensorchord/Awesome-LLMOps',
  'Hannibal046/Awesome-LLM','eugeneyan/applied-ml','ashishpatel26/500-AI-Agents-Projects',
  'deepset-ai/haystack','run-llama/llama_index','microsoft/autogen',
];
const LEARN={running:false,interval:null,total:0};

async function learnFromRepo(repoFull){
  try{
    const infoRes=await fetch(`https://api.github.com/repos/${repoFull}`);
    if(!infoRes.ok)return 0;
    const info=await infoRes.json();
    let readme='';
    for(const br of [info.default_branch,'main','master']){
      try{
        const r=await fetch(`https://raw.githubusercontent.com/${repoFull}/${br}/README.md`);
        if(r.ok){readme=await r.text();break}
      }catch(e){}
    }
    if(!readme)return 0;
    const lines=readme.split('\n');
    const found=[];
    for(const line of lines){
      const m=line.match(/^\s*[-*]\s+\[([^\]]+)\]\(([^)]+)\)\s*[-–—:]\s*(.+)$/);
      if(m){
        const name=m[1].trim(),url=m[2].trim(),desc=m[3].trim().slice(0,150);
        if(name.length>2&&name.length<80&&desc.length>8)found.push({name,url,desc,source:repoFull});
      }
    }
    const existing=new Set(STATE.memory.map(m=>{
      const match=(m.fact||'').match(/\[([^\]]+)\]/);return match?match[1].toLowerCase():'';
    }));
    let learned=0;
    for(const s of found){
      if(learned>=100)break;
      if(existing.has(s.name.toLowerCase()))continue;
      STATE.memory.push({ts:Date.now(),fact:`[${s.name}] ${s.desc} (${s.source})`,url:s.url,source:s.source,auto:true});
      learned++;existing.add(s.name.toLowerCase());
    }
    if(STATE.memory.length>3000)STATE.memory=STATE.memory.slice(-3000);
    saveMemory();
    return learned;
  }catch(e){return 0}
}

async function autoLearnCycle(){
  if(LEARN.running)return;
  LEARN.running=true;
  const shuffled=[...LEARN_SOURCES].sort(()=>Math.random()-0.5);
  let total=0;
  for(const repo of shuffled.slice(0,2)){
    setStatus(`🎓 ${repo.split('/')[1].slice(0,20)}`);

}

async function manualLearn(){

// ═══ INTENT DETECTION ═══
function detectIntent(text){
  const t=text.toLowerCase().trim();
  if(t.length<2)return null;

  // Explicit TOOL:
  let m=text.match(/TOOL:\s*([a-z_]+)\s*\|\s*(.+)/i);
  if(m)return{tool:m[1].toLowerCase(),args:m[2].trim()};

  // IMAGE GENERATION — ВАЖНО!
  m=text.match(/(?:направи|нацртај|генерирај|create|make|generate|draw|slika|слика|image)\s+(?:slika\s+)?(?:на|of|about|for)?\s*(.+)/i);
  if(m&&m[1].trim().length>2){
    const prompt=m[1].trim().replace(/^na\s+/i,'').replace(/^of\s+/i,'');
    return{tool:'generate_image',args:prompt};
  }

  // LEARN specific repo
  m=text.match(/(?:учи од|learn from|изучи|study)\s+([a-z0-9_\-]+\/[a-z0-9_\-\.]+)/i);
  if(m)return{tool:'learn_repo',args:m[1]};

  if(/^(учи|учи се|learn|учи сега|learn now|почни да учиш)$/i.test(t))
    return{tool:'__manual_learn__',args:''};

  if(/(?:авто.?учење|auto.?learn)/i.test(text)){
    if(/(?:вклучи|on|start)/i.test(text))return{tool:'auto_learn',args:'on'};
    if(/(?:исклучи|off|stop)/i.test(text))return{tool:'auto_learn',args:'off'};
    return{tool:'auto_learn',args:'status'};
  }

  m=text.match(/github\.com\/([a-z0-9_\-]+)\/([a-z0-9_\-\.]+)/i);
  if(m)return{tool:'github_repo',args:`${m[1]}/${m[2]}`};

  if(/(?:^|\s)(?:prs?|pull\s*requests?|пул\s*реквест)(?:\s|$|\?)/i.test(text)){
    m=text.match(/([a-z0-9_\-]{3,30})/i);
    const user=(m&&!['moi','my','мои','моите','prs','pr','pull'].includes(m[1].toLowerCase()))?m[1]:'klikmarkettt-dotcom';
    return{tool:'github_prs',args:user};
  }

  if(/(?:repos?|репозитори|репоа?)/i.test(text)){
    m=text.match(/(?:на|of|for|кај)\s+([a-z0-9_\-]+)/i);
    return{tool:'github_repos',args:(m?m[1]:'klikmarkettt-dotcom')+' sort=stars'};
  }

  m=text.match(/(?:github|профил|user|корисник|види|отвори|check)\s+([a-z0-9_\-]{2,30})/i);
  if(m&&!['com','github','user','profile'].includes(m[1].toLowerCase()))
    return{tool:'github_user',args:m[1]};

  m=text.match(/(?:пребарај|search|најди|find)\s+(?:github|на github|за)?\s*[:\-]?\s*(.+)/i);
  if(m&&m[1].trim().length>1)return{tool:'github_search',args:m[1].trim()};

  m=text.match(/(?:запамети|remember|памти|запиши)\s+(.+)/i);
  if(m)return{tool:'remember',args:m[1].trim()};

  if(/(?:што знаеш|what do you know|што памтиш|recall|меморија|што си научил|what have you learned)/i.test(text)){
    m=text.match(/(?:за|about)\s+(.+)/i);
    return{tool:'recall',args:m?m[1].trim():'*'};
  }

  if(/(?:колку|how many).*(?:skills?|вештини|агенти|agents)/i.test(text))
    return{tool:'__stats__',args:''};

  m=text.match(/(?:википедија|wikipedia)\s+(?:за\s+)?(.+)/i);
  if(m)return{tool:'wikipedia',args:m[1].trim()};

  if(/(?:колку е часот|what time|време|date|датум|денес|денеска)/i.test(text)&&t.length<30)
    return{tool:'time',args:''};

  if(/(?:кои tools|which tools|list tools|достапни tools|кој tools)/i.test(text))
    return{tool:'list_tools',args:''};

  if(/(?:кои агенти|which agents|агенти|list agents)/i.test(text))
    return{tool:'list_agents',args:''};

  return null;
}

// ═══ IMAGE GENERATION — REAL ═══
function buildImageURL(prompt,width=768,height=768){
  const seed=Math.floor(Math.random()*1000000);
  const enc=encodeURIComponent(prompt);
  return `https://image.pollinations.ai/prompt/${enc}?width=${width}&height=${height}&seed=${seed}&nologo=true&model=flux`;
}

// ═══ TOOLS ═══
const TOOLS={
  generate_image:async(prompt)=>{
    const url=buildImageURL(prompt,768,768);
    return `__IMAGE__${url}__PROMPT__${prompt}`;
  },
  github_user:async(u)=>{
    try{
      const r=await fetch(`https://api.github.com/users/${u.trim()}`);
      if(!r.ok)return`❌ User "${u}" не е најден`;
      const d=await r.json();
      return`**${d.login}**${d.name?' ('+d.name+')':''}\n📝 ${d.bio||'—'}\n📦 Repos: ${d.public_repos}  👥 Followers: ${d.followers}\n🔗 ${d.html_url}`;
    }catch(e){return'❌ '+e.message}
  },
  github_repos:async(args)=>{
    try{
      const p=args.trim().split(/\s+/);
      const user=p[0];
      const sort=(p[1]||'updated').replace('sort=','');
      const r=await fetch(`https://api.github.com/users/${user}/repos?per_page=20&sort=${sort}`);
      if(!r.ok)return`❌ Error ${r.status}`;
      const d=await r.json();
      if(!d.length)return`No repos for ${user}`;
      return`📦 **${user}** (${d.length}):\n\n`+d.map(x=>`• **${x.name}** ⭐${x.stargazers_count} ${x.language?'· '+x.language:''}\n  ${x.description||'—'}`).join('\n');
    }catch(e){return'❌ '+e.message}
  },
  github_repo:async(args)=>{
    try{
      const r=await fetch(`https://api.github.com/repos/${args.trim()}`);
      if(!r.ok)return`❌ Not found`;
      const d=await r.json();
      return`📦 **${d.full_name}**\n⭐ ${d.stargazers_count} 🍴 ${d.forks_count}\n💻 ${d.language||'—'}\n📝 ${d.description||''}\n🔗 ${d.html_url}`;
    }catch(e){return'❌ '+e.message}
  },
  github_prs:async(args)=>{
    try{
      const user=args.trim()||'klikmarkettt-dotcom';
      const q=user.includes('/')?`repo:${user} is:pr is:open`:`author:${user} is:pr is:open`;
      const r=await fetch(`https://api.github.com/search/issues?q=${encodeURIComponent(q)}&per_page=20`);
      if(!r.ok)return`❌ Error ${r.status}`;
      const d=await r.json();
      if(!d.items||!d.items.length)return`📋 Нема отворени PRs за **${user}**.`;
      return`📋 **Open PRs: ${d.total_count}**\n\n`+d.items.map(x=>`• #${x.number} **${x.title}**\n  📁 ${x.repository_url.split('/').slice(-2).join('/')}\n  🔗 ${x.html_url}`).join('\n\n');
    }catch(e){return'❌ '+e.message}
  },
  github_search:async(args)=>{
    try{
      const q=args.replace(/["']/g,'').trim();
      const r=await fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&per_page=10`);
      if(!r.ok)return`❌ Error ${r.status}`;
      const d=await r.json();
      if(!d.items||!d.items.length)return`🔍 Нема резултати за "${q}"`;
      return`🔍 **${d.total_count} results:**\n\n`+d.items.map(x=>`• **${x.full_name}** ⭐${x.stargazers_count}\n  ${x.description||'—'}\n  🔗 ${x.html_url}`).join('\n\n');
    }catch(e){return'❌ '+e.message}
  },
  remember:async(args)=>{
    STATE.memory.push({ts:Date.now(),fact:args});
    if(STATE.memory.length>3000)STATE.memory=STATE.memory.slice(-3000);
    saveMemory();return`✓ Запаметено: "${args}"`;
  },
  recall:async(args)=>{
    const q=args==='*'?'':args.toLowerCase();
    const m=STATE.memory.filter(x=>!q||(x.fact||'').toLowerCase().includes(q));
    if(!m.length)return`🧠 Нема зачувани факти${q?' за "'+q+'"':''}.`;
    return`🧠 **${m.length} факти:**\n\n`+m.slice(-25).map(x=>'• '+x.fact).join('\n');
  },
  wikipedia:async(args)=>{
    try{
      const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(args.trim())}`);
      if(!r.ok)return'❌ Не е најдено';
      const d=await r.json();
      return`📖 **${d.title}**\n\n${d.extract}\n\n🔗 ${d.content_urls?.desktop?.page||''}`;
    }catch(e){return'❌ '+e.message}
  },
  time:async()=>`🕐 ${new Date().toLocaleString('mk-MK',{dateStyle:'full',timeStyle:'short'})}`,
  learn_repo:async(args)=>{
    setStatus(`🎓 ${args}`);
    const n=await learnFromRepo(args.trim());
    return`✓ Научи **${n}** нови skills од **${args}**.\nМеморија: **${STATE.memory.length}**`;
  },
  auto_learn:async(cmd)=>{
    cmd=cmd.trim().toLowerCase();
    if(cmd==='on'){startAutoLearn();return'✓ Auto-learn ВКЛУЧЕНО'};
    if(cmd==='off'){if(LEARN.interval){clearInterval(LEARN.interval);LEARN.interval=null}return'✓ Auto-learn ИСКЛУЧЕНО'};
    return`🎓 **Auto-learn**\nВкупно: ${LEARN.total}\nМеморија: ${STATE.memory.length}\nСтатус: ${LEARN.interval?'✅ ON':'❌ OFF'}\nИнтервал: 3 мин`;
  },
  list_tools:async()=>'🛠 **Tools:**\n\n'+Object.keys(TOOLS).map(k=>'• '+k).join('\n'),
  list_agents:async()=>'🎭 **Агенти ('+STATE.agentCount+'):**\n\n'+Object.entries(AGENT_DATA).map(([c,d])=>`${d.e} **${c}** — ${d.p.length*d.a.length}`).join('\n'),
};

function renderMD(t){
  if(!t)return'';
  // Handle image special
  const imgMatch=t.match(/__IMAGE__(.+)__PROMPT__(.+)$/);
  if(imgMatch){
    const url=imgMatch[1],prompt=imgMatch[2];
    return`🎨 **${esc(prompt)}**\n\n<img src="${esc(url)}" alt="${esc(prompt)}" loading="lazy">\n\n<a href="${esc(url)}" target="_blank">🔗 Отвори во нов таб</a>`;
  }
  let h=esc(t);
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/^\s*[-*] (.+)$/gm,'• $1');
  h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>');
  return h;
}

async function callLLM(prompt,system=''){
  const full=(system?system+'\n\n':'')+prompt;
  const models=['openai','mistral','llama'];
  const enc=encodeURIComponent(full);
  for(const m of models){
    for(const extra of ['&private=true','']){
      try{
        const r=await fetch(`https://text.pollinations.ai/${enc}?model=${m}${extra}`);
        if(!r.ok)continue;
        const t=await r.text();
        if(t&&t.length>2&&!t.startsWith('{"error')&&!t.startsWith('<!'))return t;
      }catch(e){}
    }
  }
  return null;
}

async function sendMsg(){
  if(STATE.busy)return;
  const text=msgBox.value.trim();
  if(!text)return;
  STATE.busy=true;sendBtn.disabled=true;
  msgBox.value='';msgBox.style.height='auto';
  rmWelcome();
  addMsg('user',text);
  const th=addThinking();

  try{
    const intent=detectIntent(text);

    if(intent&&intent.tool==='__manual_learn__'){
      const result=await manualLearn();
      th.remove();addMsg('hugo',result);setStatus('Ready');
    }
    else if(intent&&intent.tool==='__stats__'){
      th.remove();
      addMsg('hugo',`📊 **Статистика**\n\n• **Агенти:** ${STATE.agentCount}\n• **Научени skills:** ${STATE.memory.length}\n• **Tools:** ${Object.keys(TOOLS).length}\n• **Auto-learn:** ${LEARN.interval?'✅ ON':'❌ OFF'}`);
      setStatus('Ready');
    }
    else if(intent&&TOOLS[intent.tool]){
      setStatus(`🛠 ${intent.tool}`);
      if(intent.tool==='generate_image')setStatus('🎨 Генерирам слика…');
      let result;
      try{result=await TOOLS[intent.tool](intent.args)}
      catch(e){result='❌ '+e.message}
      th.remove();addMsg('hugo',result);setStatus('Ready');
    }
    else{
      setStatus('💭 Thinking…');
      const mem=STATE.memory.slice(-6).map(m=>'• '+(m.fact||'')).join('\n');
      const sys=`Ти си Hugo Ultra, автономен AI агент. Одговори КРАТКО (макс 3 реченици) на македонски или англиски. Ако прашаат за слика кажи: „Напиши: направи слика на [опис]"${mem?'\n\nЗнаеш: '+mem:''}`;
      const reply=await callLLM(text,sys);
      th.remove();
      if(reply)addMsg('hugo',reply);
      else addMsg('hugo','⚠️ LLM недостапен. Пробај: „направи слика на..." или „Кои PRs ги имам" — тие работат без LLM.');
      setStatus('Ready');
    }
  }catch(e){
    th.remove();addErr('❌ '+e.message);setStatus('Error');
  }
  STATE.busy=false;sendBtn.disabled=false;msgBox.focus();
}

  const a=document.createElement('a');
  a.href=url;a.download=`hugo-chat-${Date.now()}.txt`;a.click();
  URL.revokeObjectURL(url);showToast('💾 Извезено');
}

async function installSkills(){
  if(STATE.installed){
    STATE.agentCount=localStorage.getItem('hugo8_count')|0;
    $('agent-count').textContent=STATE.agentCount.toLocaleString();
    install.classList.add('off');setTimeout(()=>install.remove(),600);return;
  }
  const steps=[
    {txt:'Initializing…',pct:15},
    {txt:'Generating agents…',pct:50},
    {txt:'Loading tools…',pct:85},
    {txt:'Ready!',pct:100},
  ];
  for(const step of steps){
    loaderText.textContent=step.txt;
    progressFill.style.width=step.pct+'%';
    await new Promise(r=>setTimeout(r,180));
  }
  const list=generateAgents();
  STATE.agentCount=list.length;
  localStorage.setItem('hugo8_installed','1');
  localStorage.setItem('hugo8_count',String(STATE.agentCount));
  $('agent-count').textContent=STATE.agentCount.toLocaleString();
  await new Promise(r=>setTimeout(r,700));
  install.classList.add('off');setTimeout(()=>install.remove(),600);
}

async function init(){
  await installSkills();
  if(!Object.keys(AGENTS).length){const list=generateAgents();STATE.agentCount=list.length}
  $('mem-count').textContent=STATE.memory.length;
  if(STATE.history.length){STATE.history.forEach(h=>addMsg(h.role,h.text,false))}
  else{showWelcome()}
  setTimeout(()=>{
    msgBox.focus();startAutoLearn();
    const el=document.createElement('div');el.className='sys';
    el.innerHTML='🎨 Пробај: <b>„Направи слика на..."</b>';
    chat.appendChild(el);scrollDown();
  },2500);
  setStatus('Ready');
}

init();
</script>
</body>
</html>
