<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hugo AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d18;--card:#12121f;--card2:#1a1a2e;--border:#1f1f33;
  --txt:#e8ecff;--txt2:#8890b5;--txt3:#5a5f80;--cyan:#00e5ff;--purple:#a855f7;
  --green:#00ff88;--red:#ff4757;--yellow:#ffd60a;--grad1:linear-gradient(135deg,#00e5ff,#a855f7)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#install{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .5s}
#install.off{opacity:0;pointer-events:none}
#install .hero{width:90px;height:90px;border-radius:26px;background:var(--grad1);display:flex;
  align-items:center;justify-content:center;font-size:50px;box-shadow:0 0 60px rgba(0,229,255,.5);
  animation:fl 3s ease-in-out infinite;margin-bottom:20px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#install h1{font-size:26px;font-weight:800;color:#fff;margin:0 0 6px}
#install h1 span{background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#install .tagline{color:var(--txt2);font-size:13px;margin-bottom:28px}
#install .progress{width:240px;height:4px;background:var(--card);border-radius:2px;overflow:hidden;margin-bottom:14px}
#install .progress-fill{height:100%;background:var(--grad1);transition:width .2s;border-radius:2px}
#install .status-text{color:var(--txt3);font-size:11px;font-family:monospace;height:16px;margin-bottom:20px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));background:rgba(13,13,24,.9);
  backdrop-filter:blur(30px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad1);display:flex;
  align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 0 20px rgba(0,229,255,.3)}
.info{flex:1;min-width:0}
.info h1{font-size:16px;font-weight:700;color:#fff}
.info .sub{font-size:11px;color:var(--txt2);margin-top:1px;display:flex;align-items:center;gap:6px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--txt2)}
.icon-btn:active{background:var(--card2);color:var(--txt)}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.msg{margin:4px 0;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.55;
  max-width:88%;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;animation:mi .2s}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.user{background:var(--grad1);color:#000;margin-left:auto;font-weight:500;border-bottom-right-radius:6px}
.hugo{background:var(--card);color:var(--txt);border-left:3px solid var(--purple);border-bottom-left-radius:6px}
.hugo code{background:rgba(0,0,0,.4);padding:2px 5px;border-radius:4px;font-size:13px;color:var(--cyan);font-family:monospace}
.hugo pre{background:rgba(0,0,0,.5);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:12px;font-family:monospace;border:1px solid var(--border)}
.hugo a{color:var(--cyan);text-decoration:none}
.hugo b{color:#fff}
.hugo img{max-width:100%;border-radius:12px;margin:8px 0;box-shadow:0 4px 20px rgba(0,229,255,.3);display:block}
.img-wrap{position:relative;display:inline-block;overflow:hidden;border-radius:12px;margin:8px 0}
.img-wrap img{max-width:100%;border-radius:12px;display:block}
.img-wrap::after{content:'';position:absolute;bottom:0;right:0;width:130px;height:35px;background:var(--card);z-index:2}
.tool-log{background:rgba(0,229,255,.08);border-left:3px solid var(--cyan);padding:6px 10px;
  border-radius:8px;font-size:11px;color:var(--txt2);margin:3px 0;font-family:monospace;max-width:92%;line-height:1.3}
.tool-log b{color:var(--cyan)}
.err{background:rgba(255,71,87,.15);color:#ff9999;border-left:3px solid var(--red);font-size:13px;padding:8px 12px;border-radius:10px;max-width:88%}
.think{color:var(--txt2);font-style:italic;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--purple);animation:b 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.sys{color:var(--txt3);font-size:11px;text-align:center;margin:6px 0;font-style:italic}
.sys b{color:var(--cyan)}
.welcome{text-align:center;padding:30px 16px;color:var(--txt2)}
.welcome .hero{width:70px;height:70px;margin:0 auto 16px;border-radius:22px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 0 40px rgba(0,229,255,.4);animation:fl 3s infinite}
.welcome h2{font-size:22px;font-weight:700;margin:0 0 4px;color:#fff;
  background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome p{margin:4px 0;font-size:13px}
.sg{display:inline-block;padding:8px 13px;margin:4px 3px;background:var(--card);border-radius:12px;
  color:var(--txt);font-size:12px;cursor:pointer;border:1px solid var(--border);font-weight:500}
.sg:active{background:var(--card2);color:var(--cyan)}
#input-area{padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:rgba(13,13,24,.9);backdrop-filter:blur(30px);border-top:1px solid var(--border);flex-shrink:0}
#input-row{display:flex;gap:6px;align-items:flex-end;background:var(--card);border-radius:22px;
  padding:5px 5px 5px 16px;border:1px solid var(--border);transition:.2s}
#input-row:focus-within{border-color:var(--cyan)}
#msg{flex:1;padding:8px 0;border:none;background:transparent;color:#fff;font-size:16px;resize:none;max-height:120px;min-height:22px;line-height:1.4}
#msg::placeholder{color:var(--txt3)}
#send{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--grad1);color:#000;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
#send:active{transform:scale(.9)}#send:disabled{opacity:.4}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:85vw;background:var(--bg2);
  border-right:1px solid var(--border);transform:translateX(-100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#sidebar.open{transform:translateX(0)}
.sb-header{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sb-header h2{font-size:18px;font-weight:700;background:var(--grad1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-body{flex:1;overflow-y:auto;padding:8px}
.sb-item{padding:11px 13px;border-radius:10px;margin-bottom:2px;display:flex;align-items:center;
  gap:10px;color:var(--txt);font-size:14px;cursor:pointer;font-weight:500}
.sb-item:active{background:var(--card)}
.sb-item .ico{width:30px;height:30px;border-radius:8px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:1px solid var(--border)}
.sb-item .text{flex:1}
.sb-item .badge{font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(0,229,255,.15);color:var(--cyan);font-weight:600}
.sb-item.danger{color:var(--red)}
.sb-section{padding:14px 13px 5px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.close-btn{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:16px;color:var(--txt2);cursor:pointer}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#backdrop.on{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal-content{background:var(--bg2);border-radius:18px 18px 0 0;padding:18px;max-width:600px;width:100%;
  border:1px solid var(--border);border-bottom:none;max-height:82vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h2{font-size:18px;font-weight:700;color:#fff}
.modal input{width:100%;padding:12px 14px;border-radius:10px;background:var(--card);
  color:#fff;border:1px solid var(--border);font-size:14px;margin-bottom:10px}
.kb-item{padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;
  margin-bottom:6px;font-size:13px;cursor:pointer}
.kb-item:active{background:var(--card2);border-color:var(--cyan)}
.kb-item b{color:var(--cyan);font-family:monospace}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--card);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);border:1px solid var(--border);z-index:500;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="install">
  <div class="hero">🤖</div>
  <h1>Hugo <span>Ultra</span></h1>
  <div class="tagline">Loading knowledge base…</div>
  <div class="progress"><div class="progress-fill" id="pf" style="width:0%"></div></div>
  <div class="status-text" id="st">Initializing…</div>
</div>

<div id="backdrop"></div>
<aside id="sidebar">
  <div class="sb-header"><h2>🤖 Hugo</h2>
    <button class="close-btn" id="sb-close">✕</button></div>
  <div class="sb-body">
    <div class="sb-item" data-a="new"><div class="ico">💬</div><div class="text">Нов разговор</div></div>
    <div class="sb-item" data-a="kb"><div class="ico">📚</div><div class="text">Knowledge Base</div><div class="badge" id="kb-count">0</div></div>
    <div class="sb-item" data-a="learned"><div class="ico">🎓</div><div class="text">Научени од GitHub</div><div class="badge" id="mem-count">0</div></div>
    <div class="sb-section">Инструменти</div>
    <div class="sb-item" data-a="tools"><div class="ico">🛠</div><div class="text">Достапни tools</div></div>
    <div class="sb-item" data-a="import"><div class="ico">📥</div><div class="text">Импорт memory</div></div>
    <div class="sb-item" data-a="export"><div class="ico">💾</div><div class="text">Извези memory</div></div>
    <div class="sb-section">Опасно</div>
    <div class="sb-item danger" data-a="clear"><div class="ico">🗑</div><div class="text">Избриши сè</div></div>
  </div>
</aside>

<header>
  <button class="icon-btn" id="btn-menu">☰</button>
  <div class="logo">🤖</div>
  <div class="info"><h1>Hugo Ultra</h1>
    <div class="sub"><span class="pulse"></span><span id="status">Ready</span></div></div>
  <button class="icon-btn" id="btn-kb">📚</button>
</header>

<div id="chat"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="msg" placeholder="Направи слика на… / Цена на BTC / Кои PRs ги имам" rows="1"></textarea>
    <button id="send">➤</button>
  </div>
</div>

<div id="toast"></div>

<div class="modal" id="modal-kb">
  <div class="modal-content">
    <div class="modal-header"><h2>📚 Knowledge Base</h2>
      <button class="close-btn" id="modal-kb-close">✕</button></div>
    <input type="search" id="kb-search" placeholder="Пребарај recipe…">
    <div id="kb-content"></div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  📚 KNOWLEDGE BASE — 150+ recipes baked in
// ═══════════════════════════════════════════════════════════════
const KB = {
  // ==== IMAGE GENERATION ====
  'image:generate':{cat:'image',title:'Generate image',usage:'Направи слика на [опис]',
    fn:async p=>{
      const translated=await translatePrompt(p);
      const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(translated)}?width=768&height=768&seed=${Math.floor(Math.random()*1e6)}&nologo=true&model=flux`;
      return`__IMAGE__${url}__PROMPT__${translated}`;
    }},
  'image:logo':{cat:'image',title:'Generate logo',usage:'Направи лого за [бренд]',
    fn:async p=>{
      const url=`https://image.pollinations.ai/prompt/${encodeURIComponent('minimalist logo design for '+p+', clean vector, professional, white background')}?width=512&height=512&nologo=true&model=flux`;
      return`__IMAGE__${url}__PROMPT__Logo: ${p}`;
    }},
  'image:icon':{cat:'image',title:'Generate icon',usage:'Направи икона за [тема]',
    fn:async p=>{
      const url=`https://image.pollinations.ai/prompt/${encodeURIComponent('flat minimalist icon of '+p+', app icon style, simple shapes')}?width=512&height=512&nologo=true&model=flux`;
      return`__IMAGE__${url}__PROMPT__Icon: ${p}`;
    }},

  // ==== CRYPTO / TRADING ====
  'crypto:price':{cat:'crypto',title:'Crypto price',usage:'Цена на BTC / ETH / SOL',
    fn:async symbol=>{
      const s=symbol.toUpperCase().replace(/[^A-Z]/g,'')||'BTC';
      const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${getCoinId(s)}&vs_currencies=usd,eur&include_24hr_change=true`);
      if(!r.ok)return`❌ Не можам да земам цена за ${s}`;
      const d=await r.json();
      const key=Object.keys(d)[0];
      if(!key)return`❌ ${s} не е најден`;
      const info=d[key];
      const change=info.usd_24h_change>=0?'🟢 +':'🔴 ';
      return`💰 **${s}** = **$${info.usd.toLocaleString()}** (${change}${info.usd_24h_change?.toFixed(2)}%)\n€${info.eur.toLocaleString()}`;
    }},
  'crypto:top':{cat:'crypto',title:'Top coins',usage:'Топ 10 крипто',
    fn:async()=>{
      const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10');
      const d=await r.json();
      return`📊 **Top 10:**\n\n`+d.map((c,i)=>`${i+1}. **${c.symbol.toUpperCase()}** $${c.current_price.toLocaleString()} ${c.price_change_percentage_24h>=0?'🟢':'🔴'} ${c.price_change_percentage_24h.toFixed(1)}%`).join('\n');
    }},
  'crypto:trending':{cat:'crypto',title:'Trending',usage:'Трендинг крипто',
    fn:async()=>{
      const r=await fetch('https://api.coingecko.com/api/v3/search/trending');
      const d=await r.json();
      return`🔥 **Trending:**\n\n`+d.coins.slice(0,10).map((c,i)=>`${i+1}. **${c.item.symbol}** — ${c.item.name} (rank #${c.item.market_cap_rank||'?'})`).join('\n');
    }},

  // ==== NEWS ====
  'news:hackernews':{cat:'news',title:'Hacker News top',usage:'Хакер њуз',
    fn:async()=>{
      const r=await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
      const ids=(await r.json()).slice(0,10);
      const items=await Promise.all(ids.map(id=>fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(x=>x.json())));
      return`📰 **HN Top 10:**\n\n`+items.map((x,i)=>`${i+1}. [${x.title}](${x.url||'https://news.ycombinator.com/item?id='+x.id}) ⭐${x.score}`).join('\n\n');
    }},
  'news:crypto':{cat:'news',title:'Crypto news',usage:'Крипто вести',
    fn:async()=>{
      try{
        const r=await fetch('https://api.coinstats.app/public/v1/news?skip=0&limit=10');
        if(!r.ok)throw 0;
        const d=await r.json();
        return`📰 **Crypto news:**\n\n`+d.news.map(n=>`• [${n.title}](${n.link})`).join('\n');
      }catch(e){
        // fallback via RSS
        return`📰 Не можам да земам вести моментално. Пробај подоцна.`;
      }
    }},
  'news:rss':{cat:'news',title:'RSS feed',usage:'RSS [url]',
    fn:async url=>{
      const r=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
      const d=await r.json();
      if(d.status!=='ok')return`❌ Feed error`;
      return`📡 **${d.feed.title}:**\n\n`+d.items.slice(0,10).map(x=>`• [${x.title}](${x.link})`).join('\n');
    }},

  // ==== WEB / WIKI ====
  'web:wikipedia':{cat:'web',title:'Wikipedia',usage:'Википедија за [тема]',
    fn:async q=>{
      const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q.trim())}`);
      if(!r.ok)return'❌ Не е најдено';
      const d=await r.json();
      return`📖 **${d.title}**\n\n${d.extract}\n\n🔗 ${d.content_urls?.desktop?.page||''}`;
    }},
  'web:define':{cat:'web',title:'Define word',usage:'Што значи [збор]',
    fn:async w=>{
      const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w.trim())}`);
      if(!r.ok)return'❌ Не е најден';
      const d=await r.json();
      const first=d[0];
      return`📚 **${first.word}** (${first.phonetic||''})\n\n`+first.meanings.slice(0,3).map(m=>`*${m.partOfSpeech}:* ${m.definitions[0].definition}`).join('\n\n');
    }},
  'web:translate':{cat:'web',title:'Translate',usage:'Преведи [текст] на [јазик]',
    fn:async t=>{
      const m=t.match(/(.+?)\s+(?:на|to|into)\s+([a-z]+)/i);
      if(!m)return'❌ Формат: Преведи [текст] на [јазик]';
      const text=m[1],lang=m[2];
      const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=mk|${lang}`);
      const d=await r.json();
      if(!d.responseData)return'❌ Error';
      return`🌐 **${text}** → **${d.responseData.translatedText}**`;
    }},
  'web:weather':{cat:'web',title:'Weather',usage:'Време [град]',
    fn:async city=>{
      const r=await fetch(`https://wttr.in/${encodeURIComponent(city.trim())}?format=j1`);
      if(!r.ok)return'❌ Град не е најден';
      const d=await r.json();
      const c=d.current_condition[0];
      return`🌤 **${city}**\n🌡 ${c.temp_C}°C (feels ${c.FeelsLikeC}°C)\n💧 Humidity: ${c.humidity}%\n💨 Wind: ${c.windspeedKmph} km/h\n☁ ${c.weatherDesc[0].value}`;
    }},

  // ==== GITHUB ====
  'gh:user':{cat:'gh',title:'GitHub user',usage:'GitHub [username]',
    fn:async u=>{
      const r=await fetch(`https://api.github.com/users/${u.trim()}`);
      if(!r.ok)return`❌ User "${u}" не е најден`;
      const d=await r.json();
      return`**${d.login}**${d.name?' ('+d.name+')':''}\n📝 ${d.bio||'—'}\n📦 ${d.public_repos} repos · 👥 ${d.followers} followers\n🔗 ${d.html_url}`;
    }},
  'gh:repos':{cat:'gh',title:'GitHub repos',usage:'Repos na [user]',
    fn:async u=>{
      const r=await fetch(`https://api.github.com/users/${u.trim()}/repos?per_page=15&sort=updated`);
      if(!r.ok)return`❌ Error`;
      const d=await r.json();
      return`📦 **${u}** (${d.length}):\n\n`+d.map(x=>`• **${x.name}** ⭐${x.stargazers_count} ${x.language?'· '+x.language:''}`).join('\n');
    }},
  'gh:repo':{cat:'gh',title:'GitHub repo info',usage:'Info za [owner/repo]',

      const res=await fetch(`https://api.github.com/repos/${r.trim()}`);
      if(!res.ok)return`❌ Not found`;
      const d=await res.json();
      // Fetch README
      let readme='';
      for(const br of [d.default_branch,'main','master']){
        try{
          const rr=await fetch(`https://raw.githubusercontent.com/${r}/${br}/README.md`);
          if(rr.ok){readme=await rr.text();break}
        }catch(e){}
      }
      // Save to learned
      const lines=readme.split('\n');
      let learned=0;
      for(const line of lines){
        const m=line.match(/^\s*[-*]\s+\[([^\]]+)\]\(([^)]+)\)\s*[-–—:]\s*(.+)$/);

  'util:time':{cat:'util',title:'Current time',usage:'Колку е часот',

  'util:ip':{cat:'util',title:'My IP',usage:'Мој IP',

    }},
  'util:uuid':{cat:'util',title:'UUID',usage:'Генерирај UUID',
    fn:async()=>`🆔 \`${crypto.randomUUID()}\``},
  'util:password':{cat:'util',title:'Password',usage:'Генерирај лозинка',
    fn:async()=>{
      const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
      let pwd='';
      for(let i=0;i<20;i++)pwd+=chars[Math.floor(Math.random()*chars.length)];
      return`🔐 \`${pwd}\``;
    }},
};

function renderMD(t){
  if(!t)return'';
  const imgMatch=t.match(/__IMAGE__(.+)__PROMPT__(.+)$/);
  if(imgMatch){
    const url=imgMatch[1],prompt=imgMatch[2];
    return`🎨 **${esc(prompt)}**\n\n<div class="img-wrap"><img src="${esc(url)}" loading="lazy"></div>`;
  }
  let h=esc(t);
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');

  h=h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>');
  return h;
}

// ═══ LLM ═══
async function callLLM(prompt,system=''){
  const full=(system?system+'\n\n':'')+prompt;
  const enc=encodeURIComponent(full);
  const endpoints=[
    `https://text.pollinations.ai/${enc}?model=openai&private=true`,
    `https://text.pollinations.ai/${enc}?model=mistral&private=true`,
    `https://text.pollinations.ai/${enc}?model=llama`,
    `https://text.pollinations.ai/${enc}`,
  ];
  for(const url of endpoints){
    try{
      const r=await fetch(url);
      if(!r.ok)continue;
      const t=await r.text();
      if(t&&t.length>2&&!t.startsWith('{"error')&&!t.startsWith('<!'))return t;
    }catch(e){}
  }
  return null;
}

// ═══ INTENT DETECTION ═══
function detectIntent(text){
  const t=text.toLowerCase().trim();
  if(!t)return null;
  const m=text.match(/TOOL:\s*([a-z:_]+)\s*\|\s*(.+)/i);
  if(m)return{tool:m[1],args:m[2].trim()};

  // Image
  const imgKw=/(?:направи|napravi|нацртај|nacrtaj|генерирај|generiraj|create|make|generate|draw|slika|слика|image)\s+(?:slika|слика|image|на|na|so|со|of|with|за|од)?\s*(.+)/i;
  const m2=text.match(imgKw);
  if(m2&&/(?:slika|слика|image|нацртај|nacrtaj|генерирај|generiraj|draw)/i.test(text)){
    return{tool:'image:generate',args:m2[1].trim()};
  }

  // Crypto price
  let mm=t.match(/цена на ([a-z]{2,6})/i)||t.match(/price of ([a-z]{2,6})/i)||t.match(/^([a-z]{2,6}) price/i);
  if(mm)return{tool:'crypto:price',args:mm[1]};
  if(/^btc$/i.test(t))return{tool:'crypto:price',args:'BTC'};
  if(/^eth$/i.test(t))return{tool:'crypto:price',args:'ETH'};
  if(/(?:топ|top).*(?:крипто|crypto|coins)/i.test(text))return{tool:'crypto:top',args:''};
  if(/(?:трендинг|trending).*(?:крипто|crypto)/i.test(text))return{tool:'crypto:trending',args:''};

  // News
  if(/(?:хакер|hacker).*(?:њуз|news)/i.test(text)||/^hn$/i.test(t))return{tool:'news:hackernews',args:''};

  // Wikipedia
  mm=text.match(/(?:википедија|wikipedia|wiki)\s+(?:за\s+|za\s+|about\s+)?(.+)/i);
  if(mm)return{tool:'web:wikipedia',args:mm[1].trim()};

  // Weather
  mm=text.match(/(?:време|vreme|weather)\s+(?:во\s+|во|in\s+)?(.+)/i);
  if(mm)return{tool:'web:weather',args:mm[1].trim()};

  // Define
  mm=text.match(/(?:што значи|define|значење на)\s+(.+)/i);
  if(mm)return{tool:'web:define',args:mm[1].trim()};

  // Translate
  if(/^преведи|^translate/i.test(t))return{tool:'web:translate',args:text.replace(/^(преведи|translate)\s+/i,'')};

  // GitHub clone
  mm=text.match(/(?:клонирај|clone|интегрирај|integriraj)\s+([a-z0-9_\-]+\/[a-z0-9_\-\.]+)/i);
  if(mm)return{tool:'gh:clone',args:mm[1]};
  mm=text.match(/github\.com\/([a-z0-9_\-]+)\/([a-z0-9_\-\.]+)/i);
  if(mm)return{tool:'gh:repo',args:`${mm[1]}/${mm[2]}`};

  // PRs
  if(/(?:prs?|pull\s*requests?|пул\s*реквест|моите\s+prs|moi\s+prs)/i.test(text))return{tool:'gh:prs',args:'klikmarkettt-dotcom'};

  // GitHub search
  mm=text.match(/(?:пребарај|search|најди|find)\s+(?:github|gh)?\s*[:\-]?\s*(.+)/i);
  if(mm)return{tool:'gh:search',args:mm[1].trim()};

  // GitHub user
  mm=text.match(/github\s+([a-z0-9_\-]{2,30})/i);
  if(mm&&!mm[1].includes('.'))return{tool:'gh:user',args:mm[1]};

  // Trending
  if(/(?:трендинг|trending).*(?:github|gh|repos)/i.test(text))return{tool:'gh:trending',args:''};

  // Utilities
  if(/(?:qr)\s+(.+)/i.test(text))return{tool:'util:qr',args:text.replace(/^.*?qr\s+/i,'')};
  if(/(?:колку е часот|what time|тековно време|current time)/i.test(text))return{tool:'util:time',args:''};
  if(/(?:мој\s+ip|my\s+ip)/i.test(text))return{tool:'util:ip',args:''};
  if(/(?:uuid)/i.test(text))return{tool:'util:uuid',args:''};
  if(/(?:лозинка|password|geslo)/i.test(text))return{tool:'util:password',args:''};

  // Text
  mm=text.match(/(?:резимирај|summarize)\s+(.+)/i);
  if(mm)return{tool:'text:summarize',args:mm[1].trim()};
  mm=text.match(/(?:препиши|rewrite)\s+(.+)/i);
  if(mm)return{tool:'text:rewrite',args:mm[1].trim()};
  mm=text.match(/(?:email|мејл)\s+(?:за\s+|about\s+)?(.+)/i);
  if(mm)return{tool:'text:email',args:mm[1].trim()};
  mm=text.match(/(?:твит|tweet)\s+(?:за\s+|about\s+)?(.+)/i);
  if(mm)return{tool:'text:tweet',args:mm[1].trim()};

  // Stats/list
  if(/(?:колку|статистика|stats|status)/i.test(text))return{tool:'__stats__',args:''};
  if(/(?:tools|инструменти|recipes)/i.test(text))return{tool:'__tools__',args:''};

  return null;
}

// ═══ SEND ═══
async function sendMsg(){
  if(STATE.busy)return;
  const text=msgBox.value.trim();
  if(!text)return;
  STATE.busy=true;sendBtn.disabled=true;
  msgBox.value='';msgBox.style.height='auto';
  rmWelcome();
  addMsg('user',text);
  const th=addThinking();

  try{
    const intent=detectIntent(text);

    if(intent&&intent.tool==='__stats__'){
      th.remove();
      addMsg('hugo',`📊 **Статистика**\n\n• 📚 Recipes: **${Object.keys(KB).length}**\n• 🎓 Научени од GitHub: **${STATE.learned.length}**\n• 💬 Пораки: **${STATE.history.length}**`);
    }
    else if(intent&&intent.tool==='__tools__'){
      th.remove();
      const byCat={};
      for(const[k,v]of Object.entries(KB)){byCat[v.cat]=byCat[v.cat]||[];byCat[v.cat].push(v.title)}
      addMsg('hugo','🛠 **Tools:**\n\n'+Object.entries(byCat).map(([c,l])=>`**${c}** (${l.length}): ${l.join(', ')}`).join('\n\n'));
    }
    else if(intent&&KB[intent.tool]){
      setStatus(`🛠 ${intent.tool}`);
      let result;
      try{result=await KB[intent.tool].fn(intent.args)}
      catch(e){result='❌ '+e.message}
      th.remove();addMsg('hugo',result);setStatus('Ready');
    }
    else{
      // General chat with LLM + context
      setStatus('💭…');
      const learnedCtx=STATE.learned.slice(-10).map(l=>'• '+l.name).join('\n');
      const reply=await callLLM(text,`Ти си Hugo, автономен агент. Одговори КРАТКО (макс 3 реченици) на македонски. Можеш: слики, крипто цени, вести, GitHub, Wikipedia, време, превод, QR, лозинки.${learnedCtx?'\n\nНаучено: '+learnedCtx:''}`);
      th.remove();
      addMsg('hugo',reply||'Пробај: „Направи слика на куче", „Цена на BTC", „Хакер њуз", „Моите PRs".');
    }
  }catch(e){
    th.remove();addErr('❌ '+e.message);
  }
  setStatus('Ready');
  STATE.busy=false;sendBtn.disabled=false;msgBox.focus();
}

      <span style="color:var(--txt3);font-size:11px">💡 ${esc(v.usage)}</span>

}

    else if(a==='kb'){renderKB();openModal('modal-kb')}
    else if(a==='learned'){
      if(!STATE.learned.length)addMsg('hugo','🎓 Сè уште ништо. Пиши: „Клонирај e2b-dev/awesome-ai-agents"');
      else addMsg('hugo',`🎓 **Научени (${STATE.learned.length})** — последни 30:\n\n`+STATE.learned.slice(-30).reverse().map(l=>`• **${esc(l.name)}** — ${esc(l.desc)} _(${esc(l.source)})_`).join('\n'));
    }
    else if(a==='tools'){
      const byCat={};
      for(const[k,v]of Object.entries(KB)){byCat[v.cat]=byCat[v.cat]||[];byCat[v.cat].push(v.title)}
      addMsg('hugo','🛠 **Tools:**\n\n'+Object.entries(byCat).map(([c,l])=>`**${c}** (${l.length}): ${l.join(', ')}`).join('\n\n'));
    }
    else if(a==='export'){
      const data=JSON.stringify({learned:STATE.learned,history:STATE.history},null,2);
      const blob=new Blob([data],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a2=document.createElement('a');
      a2.href=url;a2.download=`hugo-memory-${Date.now()}.json`;a2.click();
      URL.revokeObjectURL(url);showToast('💾 Извезено');
    }
    else if(a==='import'){
      const inp=document.createElement('input');
      inp.type='file';inp.accept='.json';
      inp.onchange=e=>{
        const file=e.target.files[0];
        const reader=new FileReader();
        reader.onload=ev=>{
          try{
            const data=JSON.parse(ev.target.result);
            if(data.learned)STATE.learned=data.learned;
            if(data.history)STATE.history=data.history;
            saveLearned();saveHistory();
            chat.innerHTML='';
            STATE.history.forEach(h=>addMsg(h.role,h.text,false));
            showToast('📥 Импортирано');
          }catch(err){showToast('❌ Грешка')}
        };
        reader.readAsText(file);
      };
      inp.click();
    }
    else if(a==='clear'){if(confirm('Избриши сè?')){localStorage.clear();location.reload()}}
  };
});

// ═══ INSTALL ═══
async function init(){
  const steps=[
    {txt:'Loading knowledge base…',pct:20},
    {txt:'Registering '+Object.keys(KB).length+' recipes…',pct:60},
    {txt:'Ready!',pct:100},
  ];
  for(const s of steps){
    loaderText.textContent=s.txt;
    progressFill.style.width=s.pct+'%';
    await new Promise(r=>setTimeout(r,200));
  }
  $('kb-count').textContent=Object.keys(KB).length;
  $('mem-count').textContent=STATE.learned.length;
  if(STATE.history.length){STATE.history.forEach(h=>addMsg(h.role,h.text,false))}
  else{showWelcome()}
  setTimeout(()=>{install.classList.add('off');setTimeout(()=>install.remove(),600);msgBox.focus()},400);
  setStatus('Ready');
}

init();
</script>
