<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hugo Ultra</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--bg:#07070f;--bg2:#0d0d18;--card:#12121f;--card2:#1a1a2e;--border:#1f1f33;--border2:#2a2a42;
  --txt:#e8ecff;--txt2:#8890b5;--txt3:#5a5f80;--cyan:#00e5ff;--purple:#a855f7;--pink:#ff2d92;
  --green:#00ff88;--yellow:#ffd60a;--red:#ff4757;--grad1:linear-gradient(135deg,#00e5ff,#a855f7)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#install{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .5s}
#install.off{opacity:0;pointer-events:none}
#install .hero{width:100px;height:100px;border-radius:28px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:56px;
  box-shadow:0 0 80px rgba(0,229,255,.5);animation:fl 3s ease-in-out infinite;margin-bottom:24px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#install h1{font-size:28px;font-weight:800;color:#fff;margin:0 0 8px}
#install h1 span{background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#install .tagline{color:var(--txt2);font-size:14px;margin-bottom:32px}
#install .progress{width:280px;max-width:80vw;height:4px;background:var(--card);border-radius:2px;overflow:hidden;margin-bottom:16px}
#install .progress-fill{height:100%;background:var(--grad1);border-radius:2px;transition:width .2s}
#install .status-text{color:var(--txt3);font-size:12px;font-family:monospace;height:18px;margin-bottom:24px}
#install .stats{display:flex;gap:20px;margin-top:8px;flex-wrap:wrap;justify-content:center}
#install .stat-mini{text-align:center}
#install .stat-mini b{display:block;font-size:20px;color:var(--cyan);font-weight:800}
#install .stat-mini span{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;font-weight:600}

header{display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));background:rgba(13,13,24,.85);
  backdrop-filter:blur(30px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 0 24px rgba(0,229,255,.4);flex-shrink:0}
.info{flex:1;min-width:0}
.info h1{font-size:16px;font-weight:700;color:#fff}
.info .sub{font-size:11px;color:var(--txt2);margin-top:1px;display:flex;align-items:center;gap:6px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--txt2)}
.icon-btn:active{background:var(--card2);color:var(--txt)}

#chat{flex:1;overflow-y:auto;padding:20px 16px 8px;scroll-behavior:smooth;
  display:flex;flex-direction:column;gap:4px}
.msg{margin:6px 0;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.55;
  max-width:88%;white-space:pre-wrap;word-wrap:break-word;word-break:break-word;animation:mi .25s}
@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.user{background:var(--grad1);color:#000;margin-left:auto;font-weight:500;
  border-bottom-right-radius:6px;box-shadow:0 4px 20px rgba(0,229,255,.25)}
.hugo{background:var(--card);color:var(--txt);border-left:3px solid var(--purple);
  border-bottom-left-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.hugo code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:5px;font-size:13px;color:var(--cyan);font-family:monospace}
.hugo pre{background:rgba(0,0,0,.5);padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0;
  font-size:13px;font-family:monospace;border:1px solid var(--border2)}
.hugo a{color:var(--cyan);text-decoration:none}
.hugo b{color:#fff}
.hugo h1,.hugo h2,.hugo h3{color:#fff;margin:8px 0 4px}
.hugo ul,.hugo ol{margin:6px 0 6px 20px}
.tool-log{background:rgba(0,229,255,.08);border-left:3px solid var(--cyan);
  padding:8px 12px;border-radius:10px;font-size:12px;color:var(--txt2);margin:4px 0;
  font-family:monospace;max-width:92%;line-height:1.4}
.tool-log b{color:var(--cyan)}
.tool-log.ok{border-left-color:var(--green);background:rgba(0,255,136,.05)}
.tool-log.ok b{color:var(--green)}
.err{background:rgba(255,71,87,.15);color:#ff9999;border-left:3px solid var(--red);
  font-size:14px;padding:10px 14px;border-radius:12px;max-width:88%}
.think{color:var(--txt2);font-style:italic;display:flex;align-items:center;gap:8px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--purple);animation:b 1.3s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.sys{color:var(--txt3);font-size:12px;text-align:center;margin:8px 0;font-style:italic}
.sys b{color:var(--cyan)}
.welcome{text-align:center;padding:40px 20px;color:var(--txt2)}
.welcome .hero{width:80px;height:80px;margin:0 auto 20px;border-radius:24px;background:var(--grad1);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 0 60px rgba(0,229,255,.5);animation:fl 3s infinite}
.welcome h2{font-size:24px;font-weight:700;margin:0 0 6px;color:#fff;
  background:var(--grad1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome p{margin:6px 0;font-size:14px}
.stats{display:flex;justify-content:center;gap:20px;margin:24px 0;flex-wrap:wrap}
.stat{text-align:center}
.stat b{display:block;font-size:24px;color:var(--cyan);font-weight:700}
.stat span{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.sg{display:inline-block;padding:10px 16px;margin:5px 4px;background:var(--card);border-radius:14px;
  color:var(--txt);font-size:13px;cursor:pointer;border:1px solid var(--border2);transition:.15s;font-weight:500}
.sg:active{background:var(--card2);border-color:var(--cyan);color:var(--cyan)}

#input-area{padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:rgba(13,13,24,.85);backdrop-filter:blur(30px);border-top:1px solid var(--border);flex-shrink:0}
#input-row{display:flex;gap:8px;align-items:flex-end;background:var(--card);border-radius:24px;
  padding:6px 6px 6px 18px;border:1px solid var(--border2);transition:.2s}
#input-row:focus-within{border-color:var(--cyan)}
#msg{flex:1;padding:8px 0;border:none;background:transparent;color:#fff;font-size:16px;
  resize:none;max-height:140px;min-height:24px;line-height:1.4}
#msg::placeholder{color:var(--txt3)}
#send{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--grad1);color:#000;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;
  box-shadow:0 0 20px rgba(0,229,255,.3)}
#send:active{transform:scale(.9)}#send:disabled{opacity:.3}

#sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;background:var(--bg2);
  border-right:1px solid var(--border);transform:translateX(-100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#sidebar.open{transform:translateX(0)}
.sb-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sb-header h2{font-size:20px;font-weight:700;background:var(--grad1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sb-body{flex:1;overflow-y:auto;padding:8px}
.sb-item{padding:12px 14px;border-radius:12px;margin-bottom:2px;display:flex;align-items:center;
  gap:12px;color:var(--txt);font-size:14px;cursor:pointer;font-weight:500}
.sb-item:active{background:var(--card)}
.sb-item .ico{width:32px;height:32px;border-radius:9px;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:16px;flex-shrink:0;border:1px solid var(--border2)}
.sb-item .text{flex:1}
.sb-item .badge{font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(0,229,255,.15);
  color:var(--cyan);font-weight:600}
.sb-item.danger{color:var(--red)}
.sb-section{padding:16px 14px 6px;font-size:11px;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;opacity:0;
  pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
#backdrop.on{opacity:1;pointer-events:auto}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal-content{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;
  max-width:600px;width:100%;border:1px solid var(--border2);border-bottom:none;
  max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h2{font-size:20px;font-weight:700;color:#fff}
.close-btn{width:36px;height:36px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--txt2);cursor:pointer}
.modal input,.modal select{width:100%;padding:14px 16px;border-radius:12px;background:var(--card);
  color:#fff;border:1px solid var(--border2);font-size:15px;margin-bottom:12px}
.agent-grid{display:grid;gap:8px;margin-top:8px}
.agent-cat{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;gap:12px}
.agent-cat:active{background:var(--card2);border-color:var(--cyan)}
.agent-cat .ico{font-size:24px;width:40px;height:40px;border-radius:11px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agent-cat .info{flex:1}
.agent-cat .info b{color:#fff;font-size:14px;display:block}
.agent-cat .info span{color:var(--txt3);font-size:11px}
.agent-item{padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.agent-item:active{background:var(--card2);border-color:var(--cyan)}

#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--card);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);border:1px solid var(--border2);z-index:500;
  opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="install">
  <div class="hero">🤖</div>
  <h1>Hugo <span>Ultra</span></h1>
  <div class="tagline">Installing…</div>
  <div class="progress"><div class="progress-fill" id="pf" style="width:0%"></div></div>
  <div class="status-text" id="st">Initializing…</div>
  <div class="stats" id="install-stats"></div>
</div>

<div id="backdrop"></div>
<aside id="sidebar">
  <div class="sb-header"><h2>🤖 Hugo Ultra</h2>
    <button class="close-btn" id="sb-close">✕</button></div>
  <div class="sb-body">
    <div class="sb-item" data-a="new"><div class="ico">💬</div><div class="text">Нов разговор</div></div>
    <div class="sb-item" data-a="agents"><div class="ico">🎭</div><div class="text">Агенти</div><div class="badge" id="agent-count">0</div></div>
    <div class="sb-item" data-a="models"><div class="ico">⚡</div><div class="text">Модел: <span id="model-name">openai</span></div></div>
    <div class="sb-section">Tools</div>
    <div class="sb-item" data-a="tools"><div class="ico">🛠</div><div class="text">Достапни tools</div></div>
    <div class="sb-item" data-a="memory"><div class="ico">🧠</div><div class="text">Меморија</div><div class="badge" id="mem-count">0</div></div>
    <div class="sb-item" data-a="learn"><div class="ico">🎓</div><div class="text">Учи од GitHub</div></div>
    <div class="sb-section">Податоци</div>
    <div class="sb-item" data-a="stats"><div class="ico">📊</div><div class="text">Статистика</div></div>
    <div class="sb-item" data-a="export"><div class="ico">💾</div><div class="text">Извези разговор</div></div>
    <div class="sb-item danger" data-a="clear"><div class="ico">🗑</div><div class="text">Избриши сè</div></div>
  </div>
</aside>

<header>
  <button class="icon-btn" id="btn-menu">☰</button>
  <div class="logo">🤖</div>
  <div class="info"><h1>Hugo Ultra</h1>
    <div class="sub"><span class="pulse"></span><span id="status">Ready</span></div></div>
  <button class="icon-btn" id="btn-agents">🎭</button>
</header>

<div id="chat"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="msg" placeholder="Кажи што да направам…" rows="1"></textarea>
    <button id="send">➤</button>
  </div>
</div>

<div id="toast"></div>

<div class="modal" id="modal-agents">
  <div class="modal-content">
    <div class="modal-header"><h2>🎭 Агенти</h2>
      <button class="close-btn" id="modal-agents-close">✕</button></div>
    <input type="search" id="agent-search" placeholder="Пребарај…">
    <div id="agent-content"></div>
  </div>
</div>

<div class="modal" id="modal-model">
  <div class="modal-content">
    <div class="modal-header"><h2>⚡ Модел</h2>
      <button class="close-btn" id="modal-model-close">✕</button></div>
    <select id="model-select">
      <option value="openai">OpenAI GPT-4o mini</option>
      <option value="openai-large">OpenAI GPT-4o</option>
      <option value="mistral">Mistral</option>
      <option value="llama">Llama 3.1</option>
      <option value="qwen-coder">Qwen Coder</option>
      <option value="deepseek">DeepSeek</option>
    </select>
    <button class="sg" id="model-save" style="width:100%;text-align:center;margin-top:8px;padding:14px">Зачувај</button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  AGENTS
// ═══════════════════════════════════════════════════════════════
const AGENT_DATA={
  coding:{e:'💻',d:'software dev',p:['Python','JavaScript','TypeScript','Rust','Go','Java','C++','C#','Ruby','PHP','Swift','Kotlin','Solidity','SQL','GraphQL','HTML','CSS','Bash'],
    a:['Developer','Debugger','Optimizer','Reviewer','Tester','Refactorer','Architect','Security Auditor','Performance Tuner']},
  trading:{e:'📈',d:'trading',p:['BTC','ETH','SOL','Altcoin','Futures','Options','Perp','Spot','Scalp','Swing','Arbitrage','Grid','Quant'],
    a:['Trader','Strategy','Risk Manager','Analyzer','Backtester','Position Sizer']},
  defi:{e:'🏦',d:'DeFi',p:['Uniswap','Aave','Curve','Compound','Lido','Balancer','GMX','Pendle','Eigenlayer','Jupiter'],
    a:['Yield Optimizer','LP Manager','Vault Strategist','Liquidation Bot','Arbitrage Bot','Risk Analyst']},
  security:{e:'🛡',d:'security',p:['Contract','Web App','Mobile','Network','Cloud','API','Blockchain','IoT'],
    a:['Auditor','Pentester','Bug Hunter','Reverse Engineer','Forensics Expert','Incident Responder']},
  analytics:{e:'📊',d:'analytics',p:['On-chain','Whale','Dune','Nansen','Glassnode','TVL','Volume','Sentiment','Mempool','Gas'],
    a:['Analyst','Reporter','Dashboard Builder','Cohort Analyst','Funnel Analyst']},
  writing:{e:'✍️',d:'writing',p:['Blog','Article','Tweet','Thread','LinkedIn','Email','Newsletter','Ad Copy','Landing Page','Whitepaper','Pitch Deck','Video Script'],
    a:['Writer','Editor','SEO Optimizer','Viral Expert','Technical Writer','Storyteller']},
  marketing:{e:'📣',d:'marketing',p:['Growth','SEO','SEM','Content','Social','Community','Discord','Twitter','Influencer','Email','Funnel','CRO','PR'],
    a:['Manager','Strategist','Analyst','Optimizer','Planner']},
  research:{e:'🔍',d:'research',p:['Web','Academic','Patent','Competitor','Market','Trend','Risk','Fact Check','OSINT','DNS'],
    a:['Researcher','Analyst','Reporter','Verifier','Investigator']},
  creative:{e:'🎨',d:'design',p:['UI','UX','Product','Graphic','Logo','Brand','Web','Mobile','Motion','3D','Game','Illustration','Typography'],
    a:['Designer','Critic','Director','Artist','Consultant']},
  business:{e:'💼',d:'business',p:['Analysis','Strategy','MBA','Startup','VC','Financial Modeling','Pricing','Revenue','OKR','Sales','Accounting','Tax'],
    a:['Expert','Advisor','Analyst','Consultant','Coach']},
  personal:{e:'🧘',d:'personal',p:['Calendar','Task','Email','Travel','Recipe','Workout','Meditation','Sleep','Habit','Goal','Career'],
    a:['Manager','Coach','Planner','Assistant','Tracker']},
  social:{e:'📱',d:'social',p:['Twitter','LinkedIn','Facebook','Instagram','TikTok','YouTube','Reddit','Discord','Telegram'],
    a:['Manager','Analyst','Engager','Growth Hacker','Content Creator','Community Builder']},
  learning:{e:'📚',d:'learning',p:['Math','Physics','Chemistry','Biology','Language','Coding','AI','SQL','Excel','Finance','Crypto','Music'],
    a:['Tutor','Mentor','Quiz Master','Explainer','Coach']},
  crypto:{e:'₿',d:'crypto',p:['Bitcoin','Ethereum','Solana','L2','NFT','RWA','DePIN','Stablecoins','Tokenomics','Launch'],
    a:['Expert','Analyst','Advisor','Builder','Investor','Trader']},
  language:{e:'🌐',d:'language',p:['Spanish','French','German','Italian','Russian','Chinese','Japanese','Korean','Arabic','Hindi','Turkish'],
    a:['Translator','Tutor','Conversation Partner','Grammar Coach','Cultural Advisor']},
};

const AGENTS={};let AGENT_ID=0;
function generateAgents(){
  const list=[];
  for(const[cat,data]of Object.entries(AGENT_DATA)){
    for(const p of data.p){
      for(const a of data.a){
        AGENT_ID++;
        const key=`${cat}_${p}_${a}`.toLowerCase().replace(/[^a-z0-9_]/g,'_');
        AGENTS[key]={id:AGENT_ID,cat,emoji:data.e,role:`${p} ${a}`,primary:p,action:a,
          desc:`${p} ${a} — ${data.d}`,
          sys:`You are a ${p} ${a} expert in ${data.d}. Be concise. Reply in user's language.`};
        list.push(key);
      }
    }
  }
  return list;
}

// ═══════════════════════════════════════════════════════════════
//  LEARN FROM GITHUB
// ═══════════════════════════════════════════════════════════════
const LEARN_SOURCES=[
  'e2b-dev/awesome-ai-agents',
  'punkpeye/awesome-mcp-servers',
  'kyrolabs/awesome-langchain',
  'steven2358/awesome-generative-ai',
  'humanloop/awesome-llm-apps',
  'tensorchord/Awesome-LLMOps',
  'Hannibal046/Awesome-LLM',
  'eugeneyan/applied-ml',
];
const LEARN={running:false,interval:null,total:0,lastRun:0};

async function learnFromRepo(repoFull){
  try{
    const infoRes=await fetch(`https://api.github.com/repos/${repoFull}`);
    if(!infoRes.ok){console.warn('repo',repoFull,infoRes.status);return 0}
    const info=await infoRes.json();
    let readme='';
    for(const br of [info.default_branch,'main','master']){
      try{
        const r=await fetch(`https://raw.githubusercontent.com/${repoFull}/${br}/README.md`);
        if(r.ok){readme=await r.text();break}
      }catch(e){}
    }
    if(!readme)return 0;
    const lines=readme.split('\n');
    const found=[];
    for(const line of lines){
      const m=line.match(/^\s*[-*]\s+\[([^\]]+)\]\(([^)]+)\)\s*[-–—:]\s*(.+)$/);
      if(m){
        const name=m[1].trim(),url=m[2].trim(),desc=m[3].trim().slice(0,150);
        if(name.length>2&&name.length<80&&desc.length>10){
          found.push({name,url,desc,source:repoFull});
        }
      }
    }
    const existing=new Set(STATE.memory.map(m=>{
      const match=(m.fact||'').match(/\[([^\]]+)\]/);
      return match?match[1].toLowerCase():'';
    }));
    let learned=0;
    for(const s of found){
      if(learned>=80)break;
      if(existing.has(s.name.toLowerCase()))continue;
      STATE.memory.push({ts:Date.now(),
        fact:`[${s.name}] from ${s.source}: ${s.desc}`,
        url:s.url,source:s.source,auto:true});
      learned++;
      existing.add(s.name.toLowerCase());
    }
    if(STATE.memory.length>3000)STATE.memory=STATE.memory.slice(-3000);
    saveMemory();
    return learned;
  }catch(e){console.warn('learn:',repoFull,e.message);return 0}
}

async function autoLearnCycle(){
  if(LEARN.running)return;
  LEARN.running=true;LEARN.lastRun=Date.now();
  const shuffled=[...LEARN_SOURCES].sort(()=>Math.random()-0.5);
  const toLearn=shuffled.slice(0,2);
  let totalLearned=0;
  for(const repo of toLearn){
    setStatus(`🎓 ${repo.split('/')[1]}`);
    const n=await learnFromRepo(repo);
    totalLearned+=n;
    await new Promise(r=>setTimeout(r,600));
  }
  LEARN.total+=totalLearned;
  if(totalLearned>0){
    const el=document.createElement('div');
    el.className='sys';
    el.innerHTML=`🎓 Научи <b>${totalLearned}</b> skills · Вкупно: <b>${STATE.memory.length}</b>`;
    chat.appendChild(el);scrollDown();
  }
  setStatus('Ready');
  LEARN.running=false;
}

function startAutoLearn(){
  if(LEARN.interval)clearInterval(LEARN.interval);
  setTimeout(()=>autoLearnCycle(),15000);
  LEARN.interval=setInterval(()=>autoLearnCycle(),180000);
}

// ═══════════════════════════════════════════════════════════════
//  INTENT DETECTION — triggers tools based on keywords
// ═══════════════════════════════════════════════════════════════
function detectIntent(text){
  const t=text.toLowerCase();

  // Explicit TOOL: format
  let m=text.match(/TOOL:\s*([a-z_]+)\s*\|\s*(.+)/i);
  if(m)return{tool:m[1].toLowerCase(),args:m[2].trim()};

  // Learn specific repo: "учи од owner/repo" or "learn owner/repo"
  m=text.match(/(?:учи од|learn from|learn|учи|изучи)\s+([a-z0-9_\-]+\/[a-z0-9_\-\.]+)/i);
  if(m)return{tool:'learn_repo',args:m[1]};

  // Auto-learn toggle
  if(/(?:авто.?учење|auto.?learn).*(?:вклучи|on|start)/i.test(text))return{tool:'auto_learn',args:'on'};
  if(/(?:авто.?учење|auto.?learn).*(?:исклучи|off|stop)/i.test(text))return{tool:'auto_learn',args:'off'};
  if(/(?:статус|status|status на|состојба).*(?:учење|learn)/i.test(text))return{tool:'auto_learn',args:'status'};

  // "Учи" alone → trigger manual learn cycle
  if(/^(учи|учи се|learn|learn now|учи сега)$/i.test(t.trim())){
    return{tool:'__manual_learn__',args:''};
  }

  // GitHub URL detection
  m=text.match(/github\.com\/([a-z0-9_\-]+)\/([a-z0-9_\-\.]+)/i);
  if(m)return{tool:'github_repo',args:`${m[1]}/${m[2]}`};

  // GitHub user reference
  m=text.match(/(?:github|профил|user|корисник|види|отвори)\s+([a-z0-9_\-]{2,30})/i);
  if(m&&!m[1].includes('.'))return{tool:'github_user',args:m[1]};

  // Search
  m=text.match(/(?:пребарај|search|најди|find)\s+(?:github|на github)?\s*[:\-]?\s*(.+)/i);
  if(m)return{tool:'github_search',args:m[1].trim()};

  // PRs
  if(/(?:\bprs?\b|pull request|пул реквест)/i.test(text)){
    m=text.match(/(?:моите|my|на|for)\s+([a-z0-9_\-]+)/i);
    return{tool:'github_prs',args:m?m[1]:'klikmarkettt-dotcom'};
  }

  // Repos
  if(/(?:\brepos?\b|репозитори|repo.?s)/i.test(text)){
    m=text.match(/(?:на|of|for)\s+([a-z0-9_\-]+)/i);
    return{tool:'github_repos',args:(m?m[1]:'klikmarkettt-dotcom')+' sort=stars'};
  }

  // Remember
  m=text.match(/(?:запамети|remember|памти)\s+(.+)/i);
  if(m)return{tool:'remember',args:m[1].trim()};

  // Recall
  if(/(?:што знаеш|what do you know|што памтиш|recall|меморија)/i.test(text)){
    m=text.match(/(?:за|about)\s+(.+)/i);
    return{tool:'recall',args:m?m[1]:'*'};
  }

  // Wikipedia
  m=text.match(/(?:википедија|wikipedia)\s+(?:за\s+)?(.+)/i);
  if(m)return{tool:'wikipedia',args:m[1].trim()};

  // Time
  if(/(?:колку е часот|time|време|date|датум)/i.test(text)){
    return{tool:'time',args:''};
  }

  // Tools list
  if(/(?:кои tools|which tools|tools|достапни tools)/i.test(text)){
    return{tool:'list_tools',args:''};
  }

  // Agents list
  if(/(?:кои агенти|which agents|агенти|list agents)/i.test(text)){
    return{tool:'list_agents',args:''};
  }

  return null;
}

// ═══════════════════════════════════════════════════════════════
//  TOOLS (direct executors, no LLM involved)
// ═══════════════════════════════════════════════════════════════
const TOOLS={
  github_user:async(u)=>{
    const r=await fetch(`https://api.github.com/users/${u.trim()}`);
    if(!r.ok)return`❌ User "${u}" not found (HTTP ${r.status})`;
    const d=await r.json();
    return`**${d.login}**${d.name?' ('+d.name+')':''}\nBio: ${d.bio||'—'}\n📦 Repos: ${d.public_repos}  👥 Followers: ${d.followers}  📍 ${d.location||'—'}\n🔗 ${d.html_url}`;
  },
  github_repos:async(args)=>{
    const p=args.trim().split(/\s+/);
    const user=p[0];
    const sort=(p[1]||'updated').replace('sort=','');
    const r=await fetch(`https://api.github.com/users/${user}/repos?per_page=20&sort=${sort}`);
    if(!r.ok)return`❌ Error ${r.status}`;
    const d=await r.json();
    if(!d.length)return'No repos';
    return`📦 **${user}'s repos** (${d.length}):\n\n`+d.map(x=>`• **${x.name}** ⭐${x.stargazers_count} ${x.language?'· '+x.language:''}\n  ${x.description||'—'}`).join('\n');
  },
  github_repo:async(args)=>{
    const r=await fetch(`https://api.github.com/repos/${args.trim()}`);
    if(!r.ok)return`❌ Not found (${r.status})`;
    const d=await r.json();
    return`📦 **${d.full_name}**\n⭐ ${d.stargazers_count}  🍴 ${d.forks_count}\nLanguage: ${d.language||'—'}\n${d.description||''}\n🔗 ${d.html_url}`;
  },
  github_prs:async(args)=>{
    const q=args.includes('/')?`repo:${args.trim()} is:pr is:open`:`author:${args.trim()} is:pr is:open`;
    const r=await fetch(`https://api.github.com/search/issues?q=${encodeURIComponent(q)}&per_page=15`);
    if(!r.ok)return`❌ Error ${r.status}`;
    const d=await r.json();
    if(!d.items||!d.items.length)return`No open PRs found for "${args}".`;
    return`📋 **Open PRs (${d.total_count}):**\n\n`+d.items.map(x=>`• #${x.number} **${x.title}**\n  📁 ${x.repository_url.split('/').slice(-2).join('/')}\n  🔗 ${x.html_url}`).join('\n');
  },
  github_search:async(args)=>{
    const q=args.replace(/["']/g,'').trim();
    const r=await fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&per_page=10`);
    if(!r.ok)return`❌ Error ${r.status}`;
    const d=await r.json();
    if(!d.items||!d.items.length)return`No results for "${q}"`;
    return`🔍 **Top results for "${q}":**\n\n`+d.items.map(x=>`• **${x.full_name}** ⭐${x.stargazers_count}\n  ${x.description||'—'}\n  🔗 ${x.html_url}`).join('\n\n');
  },
  remember:async(args)=>{STATE.memory.push({ts:Date.now(),fact:args});
    if(STATE.memory.length>3000)STATE.memory=STATE.memory.slice(-3000);
    saveMemory();return`✓ Запаметено: "${args}"`;},
  recall:async(args)=>{
    const q=args==='*'?'':args.toLowerCase();
    const m=STATE.memory.filter(x=>!q||(x.fact||'').toLowerCase().includes(q));
    if(!m.length)return`Нема пронајдени факти.`;
    return`🧠 **Пронајдени ${m.length} факти:**\n\n`+m.slice(-20).map(x=>'• '+x.fact).join('\n');
  },
  wikipedia:async(args)=>{
    const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(args.trim())}`);
    if(!r.ok)return'❌ Not found';
    const d=await r.json();
    return`📖 **${d.title}**\n\n${d.extract}\n\n🔗 ${d.content_urls?.desktop?.page||''}`;
  },
  time:async()=>`🕐 ${new Date().toLocaleString('mk-MK',{dateStyle:'full',timeStyle:'short'})}`,
  learn_repo:async(args)=>{
    setStatus(`🎓 Учи од ${args}…`);
    const n=await learnFromRepo(args.trim());
    return`✓ Научи **${n}** нови skills од **${args}**.\nМеморија: ${STATE.memory.length}`;
  },
  auto_learn:async(cmd)=>{
    cmd=cmd.trim().toLowerCase();
    if(cmd==='on'){startAutoLearn();return'✓ Auto-learn ВКЛУЧЕНО — на секои 3 мин'};
    if(cmd==='off'){if(LEARN.interval){clearInterval(LEARN.interval);LEARN.interval=null}return'✓ Auto-learn ИСКЛУЧЕНО'};
    return`🎓 **Auto-learn статус**\nВкупно научено: ${LEARN.total}\nМеморија: ${STATE.memory.length}\nИнтервал: 3 мин\nСтатус: ${LEARN.interval?'✅ ON':'❌ OFF'}\n\nИзвори:\n${LEARN_SOURCES.map(s=>'• '+s).join('\n')}`;
  },
  list_tools:async()=>{
    const list=Object.keys(TOOLS).map(k=>'• **'+k+'**').join('\n');
    return`🛠 **Достапни tools (${Object.keys(TOOLS).length}):**\n\n${list}\n\n💡 Пробај: "Кои PRs ги имам", "Види github.com/torvalds", "Учи од e2b-dev/awesome-ai-agents", "Запамети X"`;
  },
  list_agents:async()=>{
    return`🎭 **Агенти (${STATE.agentCount}):**\n\n`+Object.entries(AGENT_DATA).map(([c,d])=>`• ${d.e} **${c}** — ${d.d} (${d.p.length*d.a.length})`).join('\n');
  },
};

async function manualLearn(){
  setStatus('🎓 Учи…');
  const shuffled=[...LEARN_SOURCES].sort(()=>Math.random()-0.5);
  let total=0;
  for(const repo of shuffled.slice(0,3)){
    const n=await learnFromRepo(repo);
    total+=n;
    await new Promise(r=>setTimeout(r,500));
  }
  LEARN.total+=total;
  setStatus('Ready');
  return`🎓 Научи **${total}** нови skills од 3 repos.\nВкупно во меморија: **${STATE.memory.length}**`;
}

function renderMD(t){
  if(!t)return'';
  let h=esc(t);
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/^\s*[-*] (.+)$/gm,'• $1');
  h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>');
  return h;
}

// ═══════════════════════════════════════════════════════════════
//  LLM (for general chat only)
// ═══════════════════════════════════════════════════════════════
async function callLLM(prompt,system=''){
  const full=(system?system+'\n\n':'')+prompt;
  const models=[STATE.model,'openai','mistral','llama'];
  const tried=new Set();
  for(const model of models){
    if(tried.has(model))continue;
    tried.add(model);
    try{
      const url=`https://text.pollinations.ai/${encodeURIComponent(full)}?model=${model}&private=true`;
      const r=await fetch(url,{method:'GET'});
      if(!r.ok)continue;
      const t=await r.text();
      if(t&&t.length>2&&!t.startsWith('{"error'))return t;
    }catch(e){}
  }
  throw new Error('LLM unavailable');
}

// ═══════════════════════════════════════════════════════════════
//  SEND
// ═══════════════════════════════════════════════════════════════
async function sendMsg(){
  if(STATE.busy)return;
  const text=msgBox.value.trim();
  if(!text)return;
  STATE.busy=true;sendBtn.disabled=true;
  msgBox.value='';msgBox.style.height='auto';
  rmWelcome();
  addMsg('user',text);
  const th=addThinking();

  try{
    const intent=detectIntent(text);

    if(intent&&intent.tool==='__manual_learn__'){
      const result=await manualLearn();
      th.remove();
      addMsg('hugo',result);
      setStatus('Ready');
    }
    else if(intent&&TOOLS[intent.tool]){
      setStatus(`🛠 ${intent.tool}`);
      const log=addToolLog(intent.tool,intent.args,'running…',false);
      let result;
      try{result=await TOOLS[intent.tool](intent.args)}
      catch(e){result='❌ Error: '+e.message}
      log.className='tool-log ok';
      log.innerHTML=`<b>🛠 ${esc(intent.tool)}</b>(${esc(intent.args)})\n${esc(String(result).slice(0,300))}`;
      th.remove();
      addMsg('hugo',result);
      setStatus('Ready');
    }
    else{
      // General chat with context
      setStatus('💭 Thinking…');
      const mem=STATE.memory.slice(-10).map(m=>'• '+(m.fact||'')).join('\n');
      const sys=`You are Hugo Ultra, autonomous AI agent. Reply in user's language (Macedonian/English). Be concise and useful. User has ${STATE.agentCount} agents and ${STATE.memory.length} learned skills.${mem?'\n\nUser memory:\n'+mem:''}`;
      const reply=await callLLM(text,sys);
      th.remove();
      addMsg('hugo',reply);
      setStatus('Ready');
    }
  }catch(e){
    th.remove();
    addErr('❌ '+e.message);
    setStatus('Error');
  }
  STATE.busy=false;sendBtn.disabled=false;msgBox.focus();
}

function renderAgentCategories(){
  const html=Object.entries(AGENT_DATA).map(([cat,d])=>{

    return`<div class="agent-cat" onclick="openAgentCat('${cat}')">

window.openAgentCat=function(cat){
  const d=AGENT_DATA[cat];
  let html=`<button class="sg" onclick="renderAgentCategories()" style="margin-bottom:12px">← Назад</button>`;
  let count=0;
  for(const p of d.p){
    for(const a of d.a){
      const key=`${cat}_${p}_${a}`.toLowerCase().replace(/[^a-z0-9_]/g,'_');
      html+=`<div class="agent-item" onclick="selectAgent('${key}')">
        <span style="width:6px;height:6px;background:var(--cyan);border-radius:50%"></span>
        <span>${esc(p)} <span style="color:var(--txt3)">${esc(a)}</span></span>
      </div>`;
      count++;if(count>150)break;
    }
    if(count>150)break;
  }
  $('agent-content').innerHTML=html;
};
window.selectAgent=function(key){
  const a=AGENTS[key];if(!a)return;
  closeModal('modal-agents');
  showToast(`✅ ${a.role}`,2000);
  msgBox.placeholder=`${a.role}: кажи задача…`;

};
function searchAgents(q){

  const r=[];

    if(k.includes(q)||a.role.toLowerCase().includes(q)){r.push({k,a});if(r.length>80)break}

  if(!r.length){$('agent-content').innerHTML='<div style="text-align:center;color:var(--txt3);padding:20px">Нема резултати</div>';return}

    else if(a==='memory'){TOOLS.recall('*').then(r=>addMsg('hugo',r))}
    else if(a==='learn'){TOOLS.auto_learn('status').then(r=>addMsg('hugo',r))}
    else if(a==='stats'){showToast(`📊 ${STATE.history.length} пораки · ${STATE.agentCount} агенти · ${STATE.memory.length} навыци`,3000)}
    else if(a==='export'){exportChat()}
    else if(a==='clear'){if(confirm('Избриши сè?')){localStorage.clear();location.reload()}}
  };
});
$('btn-agents').onclick=()=>{renderAgentCategories();openModal('modal-agents')};
$('modal-agents-close').onclick=()=>closeModal('modal-agents');
$('agent-search').addEventListener('input',e=>searchAgents(e.target.value));
$('modal-model-close').onclick=()=>closeModal('modal-model');
$('model-save').onclick=()=>{
  STATE.model=$('model-select').value;
  localStorage.setItem('hugo6_model',STATE.model);
  $('model-name').textContent=STATE.model;
  closeModal('modal-model');
  showToast(`✅ ${STATE.model}`);
};
function exportChat(){
  const txt=STATE.history.map(h=>`[${h.role}]\n${h.text}`).join('\n\n---\n\n');
  const blob=new Blob([txt],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`hugo-chat-${Date.now()}.txt`;a.click();
  URL.revokeObjectURL(url);
  showToast('💾 Извезено');
}

// ═══════════════════════════════════════════════════════════════
//  INSTALL
// ═══════════════════════════════════════════════════════════════
async function installSkills(){
  if(STATE.installed){
    STATE.agentCount=localStorage.getItem('hugo6_count')|0;
    $('agent-count').textContent=STATE.agentCount.toLocaleString();
    install.classList.add('off');
    setTimeout(()=>install.remove(),600);
    return;
  }
  const steps=[
    {txt:'Initializing core…',pct:10},
    {txt:'Generating agents…',pct:35},
    {txt:'Loading tools…',pct:65},
    {txt:'Ready!',pct:100},
  ];
  for(const step of steps){
    loaderText.textContent=step.txt;
    progressFill.style.width=step.pct+'%';
    await new Promise(r=>setTimeout(r,200));
  }
  const list=generateAgents();
  STATE.agentCount=list.length;
  localStorage.setItem('hugo6_installed','1');
  localStorage.setItem('hugo6_count',String(STATE.agentCount));
  $('agent-count').textContent=STATE.agentCount.toLocaleString();
  $('install-stats').innerHTML=`
    <div class="stat-mini"><b>${STATE.agentCount.toLocaleString()}</b><span>Agents</span></div>
    <div class="stat-mini"><b>${Object.keys(TOOLS).length}</b><span>Tools</span></div>
    <div class="stat-mini"><b>${Object.keys(AGENT_DATA).length}</b><span>Categories</span></div>`;
  await new Promise(r=>setTimeout(r,900));
  install.classList.add('off');
  setTimeout(()=>install.remove(),600);
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
async function init(){
  await installSkills();
  if(!Object.keys(AGENTS).length){
    const list=generateAgents();
    STATE.agentCount=list.length;
  }
  $('model-name').textContent=STATE.model;
  $('mem-count').textContent=STATE.memory.length;
  if(STATE.history.length){
    STATE.history.forEach(h=>addMsg(h.role,h.text,false));
  }else{
    showWelcome();
  }
  setTimeout(()=>{
    msgBox.focus();
    startAutoLearn();
    const el=document.createElement('div');
    el.className='sys';
    el.innerHTML='🎓 <b>Auto-learn ON</b> — Hugo учи од GitHub на секои 3 мин';
    chat.appendChild(el);scrollDown();
  },3000);
  setStatus('Ready');
}

init();
</script>
